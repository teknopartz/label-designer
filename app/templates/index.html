<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LabelSmith</title>
  <style>
    @font-face { font-family: 'DejaVu Sans'; src: url('/static/fonts/DejaVuSans.ttf') format('truetype'); font-weight: normal; font-style: normal; }
    @font-face { font-family: 'DejaVu Sans'; src: url('/static/fonts/DejaVuSans-Bold.ttf') format('truetype'); font-weight: bold; font-style: normal; }
    @font-face { font-family: 'DejaVu Sans'; src: url('/static/fonts/DejaVuSans-Oblique.ttf') format('truetype'); font-weight: normal; font-style: italic; }
    @font-face { font-family: 'DejaVu Sans'; src: url('/static/fonts/DejaVuSans-BoldOblique.ttf') format('truetype'); font-weight: bold; font-style: italic; }

    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 32px auto; padding: 0 16px; color: #333; }
    h1 { font-size: 1.1rem; color: #444; text-align: center; }
    .page-hint { text-align: center; color: #888; font-size: 0.8rem; }
    .layout { display: flex; flex-direction: column; gap: 16px; }
    .toolbar { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .toolbar button { padding: 10px 16px; font-size: 0.95rem; cursor: pointer; }
    /* Sized to hug its actual content (the canvas) — must NOT flex-grow past
       that, or the background visually extends past the true label edge
       while dragged elements still clip exactly at the real boundary. */
    #stage-wrap { border: 1px solid #ccc; background: #fafafa; padding: 12px; display: inline-block; max-width: 100%; overflow-x: auto; flex: 0 0 auto; align-self: center; }
    #stage-container { transform-origin: top left; }

    /* Property panel: shares the .dropdown-panel card chrome (border/
       radius/background/shadow) so it looks like the same single area as
       the Font/Icon/Templates pickers, just with its own content layout —
       controls arranged in a row and wrapping, sized for touch rather than
       a narrow desktop sidebar. */
    #panel { width: 100%; box-sizing: border-box; font-size: 0.95rem; transition: opacity 0.15s; }
    #panel.disabled { opacity: 0.45; pointer-events: none; }
    #panel h2 { font-size: 0.95rem; margin: 0 0 12px; color: #555; }
    #panel .field { display: flex; flex-direction: column; gap: 4px; }
    #panel .field label { font-size: 0.8rem; color: #666; }
    #panel .fields-row { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-end; }
    #panel .field.grow { flex: 1 1 260px; min-width: 220px; }
    #panel input[type=number], #panel input[type=text] { box-sizing: border-box; padding: 8px; font-size: 1rem; }
    #panel input[type=range] { width: 100%; height: 32px; }
    #panel .checks { display: flex; gap: 16px; align-items: center; }
    #panel .checks label { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; color: #333; }
    #panel .checks input { width: 20px; height: 20px; }
    #panel .row { display: flex; gap: 8px; align-items: center; }
    #panel button { padding: 10px 16px; cursor: pointer; font-size: 0.95rem; }
    #panel .actions-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    #panel .empty { color: #999; font-style: italic; }

    /* Custom font-family picker — native <select> can't reliably render each
       option in its own font (especially on Android), so this is a styled
       dropdown built from scratch. */
    .font-dropdown { position: relative; }
    .font-dropdown-btn { width: 100%; box-sizing: border-box; text-align: left; padding: 10px; font-size: 1rem; background: white; border: 1px solid #bbb; border-radius: 4px; cursor: pointer; }
    .font-dropdown-list { position: absolute; z-index: 20; top: 100%; left: 0; right: 0; max-height: 260px; overflow-y: auto; background: white; border: 1px solid #bbb; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); display: none; }
    .font-dropdown-list.open { display: block; }
    .font-dropdown-item { padding: 12px; font-size: 1.15rem; cursor: pointer; border-bottom: 1px solid #eee; }
    .font-dropdown-item:hover, .font-dropdown-item:focus { background: #f0f6ff; }
    .font-dropdown-item.selected { background: #e6f0ff; }

    .actions { margin-top: 8px; display: flex; justify-content: flex-end; }
    .actions button { padding: 10px 20px; font-size: 1rem; cursor: pointer; }
    #status { margin-top: 12px; font-size: 0.9rem; min-height: 1.2em; text-align: right; }
    .error { color: #b00; }
    .ok { color: #060; }
    .hint { font-size: 0.8rem; color: #888; }

    /* Shared style for the Font/Icon/Templates toolbar dropdowns, so they
       look and behave consistently instead of each being a slightly
       different one-off box. */
    .dropdown-panel { margin-bottom: 12px; padding: 14px; border: 1px solid #ccc; border-radius: 6px; background: #fafcff; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
    .dropdown-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .dropdown-panel-header h3 { margin: 0; font-size: 1rem; color: #444; }
    .dropdown-close { width: auto; margin-top: 0; padding: 4px 12px; font-size: 1rem; line-height: 1.2; cursor: pointer; background: #eee; border: 1px solid #ccc; border-radius: 4px; }
    #iconPicker button { font-size: 1.6rem; padding: 6px 10px; margin: 2px; cursor: pointer; font-family: 'DejaVu Sans', sans-serif; }
    .font-spinner {
      display: inline-block; width: 12px; height: 12px; margin-right: 6px;
      border: 2px solid #ccc; border-top-color: #666; border-radius: 50%;
      animation: font-spin 0.7s linear infinite; vertical-align: middle;
    }
    @keyframes font-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>🏷️ LabelSmith <span style="font-weight:normal; color:#888; font-size:0.75em;">— 62mm label designer</span></h1>
  <p class="page-hint">Click an element to select it (handles let you resize/rotate). Double-click text to edit. Drag to reposition.</p>

  <div class="toolbar">
    <button id="addText">📝 Text</button>
    <button id="addImageBtn">🖼️ Image</button>
    <input type="file" id="imageInput" accept="image/*" style="display:none">
    <button id="addBorder">⬜ Border</button>
    <button id="addLine">➖ Line</button>
    <button id="addDate">📅 Date</button>
    <button id="addIconBtn">⭐ Icon</button>
    <button id="addFontBtn">🔤 Font</button>
    <button id="templatesBtn">📁 Templates</button>
  </div>
  <!-- Single shared panel slot: exactly one of these is visible at a time,
       whichever is currently relevant — a selected element's properties, or
       a toolbar dropdown (Font/Icon/Templates search). See showTopPanel(). -->
  <div id="panel" class="dropdown-panel disabled"><div class="empty">Nothing selected</div></div>
  <div id="templatesPanel" class="dropdown-panel" style="display:none;">
    <div class="dropdown-panel-header"><h3>Templates</h3><button type="button" class="dropdown-close" data-target="templatesPanel">✕</button></div>
    <div class="row" style="margin-top:0;">
      <input type="text" id="templateName" placeholder="Template name (e.g. Coffee)" style="flex:1;">
      <button type="button" id="templateSaveBtn" style="width:auto; margin-top:0; padding:6px 14px;">Save</button>
    </div>
    <div id="templateList" style="margin-top:10px;"></div>
  </div>
  <div id="iconPicker" class="dropdown-panel" style="display:none;">
    <div class="dropdown-panel-header"><h3>Icons</h3><button type="button" class="dropdown-close" data-target="iconPicker">✕</button></div>
    <div id="iconStarter"></div>
    <input type="text" id="iconSearch" placeholder="Search more icons (Material Symbols)..." style="width:100%; margin-top:8px; box-sizing:border-box;">
    <div id="iconResults" style="margin-top:6px;"></div>
  </div>
  <div id="fontPicker" class="dropdown-panel" style="display:none;">
    <div class="dropdown-panel-header"><h3>Fonts</h3><button type="button" class="dropdown-close" data-target="fontPicker">✕</button></div>
    <input type="text" id="fontSearch" placeholder="Search Google Fonts..." style="width:100%; box-sizing:border-box;">
    <div id="fontResults" style="margin-top:6px; font-size:0.85rem;"></div>
  </div>

  <div class="layout">
    <div id="stage-wrap"><div id="stage-container"></div></div>
  </div>

  <div class="actions">
    <button id="printBtn">🖨️ Print</button>
  </div>
  <div id="status"></div>

<script src="/static/vendor/konva.min.js"></script>
{% raw %}
<script>
const LABEL_WIDTH = 696;
const MARGIN_TOP = 24, MARGIN_BOTTOM = 24, MARGIN_LEFT = 35, MARGIN_RIGHT = 35;
const MIN_HEIGHT = 120;

const stage = new Konva.Stage({ container: 'stage-container', width: LABEL_WIDTH, height: MIN_HEIGHT });
const layer = new Konva.Layer();
stage.add(layer);

const transformer = new Konva.Transformer({ rotateEnabled: true });
layer.add(transformer);

// Resize-snapping: boundBoxFunc receives the box the Transformer is about
// to apply and can hand back a corrected one — the standard Konva mechanism
// for this, rather than fighting the Transformer's own internal scale math.
// Skipped while rotated to keep the edge math simple (rotation makes "left
// edge" ambiguous in stage coordinates).
transformer.boundBoxFunc((oldBox, newBox) => {
  const node = transformer.nodes()[0];
  guideLayer.destroyChildren();
  if (!node || newBox.rotation !== 0) { guideLayer.batchDraw(); return newBox; }

  const stops = getGuideStops(node);
  const left = newBox.x, right = newBox.x + newBox.width;
  const top = newBox.y, bottom = newBox.y + newBox.height;

  for (const s of stops.vertical) {
    if (Math.abs(left - s) < SNAP_THRESHOLD) { newBox.width += newBox.x - s; newBox.x = s; drawGuide('V', s); break; }
    if (Math.abs(right - s) < SNAP_THRESHOLD) { newBox.width = s - newBox.x; drawGuide('V', s); break; }
  }
  for (const s of stops.horizontal) {
    if (Math.abs(top - s) < SNAP_THRESHOLD) { newBox.height += newBox.y - s; newBox.y = s; drawGuide('H', s); break; }
    if (Math.abs(bottom - s) < SNAP_THRESHOLD) { newBox.height = s - newBox.y; drawGuide('H', s); break; }
  }
  guideLayer.batchDraw();

  if (newBox.width < 5 || newBox.height < 5) return oldBox;
  return newBox;
});

// Separate, non-interactive layer for the temporary snap-guide lines drawn
// while dragging. Cleared before every export just in case — a stray guide
// line has no business ending up on a printed label.
const guideLayer = new Konva.Layer({ listening: false });
stage.add(guideLayer);

let elements = [];   // all Konva nodes the user placed
let selected = null; // currently selected node

// ---------- selection ----------

function select(node, keepDropdownOpen) {
  selected = node;
  transformer.nodes(node ? [node] : []);
  layer.draw();
  const panel = document.getElementById('panel');
  if (node) {
    if (!keepDropdownOpen) showTopPanel('panel');
    panel.classList.remove('disabled');
    renderPanel();
  } else {
    // Leave whatever was last shown in place, just dimmed — switching to a
    // blank "Nothing selected" panel and back is jarring while dragging
    // elements near each other, since selection blips through null.
    panel.classList.add('disabled');
  }
}

stage.on('click tap', (e) => {
  if (e.target === stage) { select(null); return; }
  if (elements.includes(e.target)) select(e.target);
});

document.addEventListener('keydown', (e) => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && selected && document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.tagName !== 'INPUT') {
    deleteSelected();
  }
});

function deleteSelected() {
  if (!selected) return;
  elements = elements.filter(el => el !== selected);
  selected.destroy();
  select(null);
  recalcStageSize();
}

// ---------- stage sizing ----------

function recalcStageSize() {
  let maxBottom = MIN_HEIGHT - MARGIN_BOTTOM;
  for (const el of elements) {
    const box = el.getClientRect({ relativeTo: stage });
    maxBottom = Math.max(maxBottom, box.y + box.height);
  }
  stage.height(Math.max(maxBottom + MARGIN_BOTTOM, MIN_HEIGHT));
  scaleToViewport();
  layer.draw();
}

function scaleToViewport() {
  const wrap = document.getElementById('stage-wrap');
  const available = wrap.clientWidth - 24;
  const scale = Math.min(1, available / LABEL_WIDTH);
  document.getElementById('stage-container').style.transform = `scale(${scale})`;
  wrap.style.height = (stage.height() * scale + 24) + 'px';
}
window.addEventListener('resize', scaleToViewport);

// ---------- element registration (common wiring for every element type) ----------

// ---------- snap / alignment guides ----------

const SNAP_THRESHOLD = 14; // px, in stage coordinates — generous enough to actually notice/trust on touch

function getGuideStops(skipNode) {
  // Snap to the printable margins, not the raw stage edges — content that
  // snaps flush to x=0/LABEL_WIDTH would sit right at the roll's physical
  // edge, which is exactly what margins exist to avoid.
  const vertical = [MARGIN_LEFT, LABEL_WIDTH / 2, LABEL_WIDTH - MARGIN_RIGHT];
  const horizontal = [0];
  elements.forEach((el) => {
    if (el === skipNode) return;
    const box = el.getClientRect({ relativeTo: stage });
    vertical.push(box.x, box.x + box.width / 2, box.x + box.width);
    horizontal.push(box.y, box.y + box.height / 2, box.y + box.height);
  });
  return { vertical, horizontal };
}

function getNodeEdges(node, box) {
  return {
    vertical: [box.x, box.x + box.width / 2, box.x + box.width],
    horizontal: [box.y, box.y + box.height / 2, box.y + box.height],
  };
}

function drawGuide(orientation, pos) {
  const points = orientation === 'V' ? [pos, -6000, pos, 6000] : [-6000, pos, 6000, pos];
  guideLayer.add(new Konva.Line({ points, stroke: '#ff3b8d', strokeWidth: 2.5, dash: [8, 5] }));
}

function snapOnDragMove(node) {
  guideLayer.destroyChildren();
  const stops = getGuideStops(node);
  const box = node.getClientRect({ relativeTo: stage });
  const edges = getNodeEdges(node, box);

  // Find the single best-matching stop per axis (smallest snap distance).
  let dx = 0, bestVDiff = SNAP_THRESHOLD, matchedV = null;
  edges.vertical.forEach((edge) => {
    stops.vertical.forEach((stop) => {
      const diff = Math.abs(edge - stop);
      if (diff < bestVDiff) { bestVDiff = diff; dx = stop - edge; matchedV = stop; }
    });
  });
  let dy = 0, bestHDiff = SNAP_THRESHOLD, matchedH = null;
  edges.horizontal.forEach((edge) => {
    stops.horizontal.forEach((stop) => {
      const diff = Math.abs(edge - stop);
      if (diff < bestHDiff) { bestHDiff = diff; dy = stop - edge; matchedH = stop; }
    });
  });

  node.x(node.x() + dx);
  node.y(node.y() + dy);
  if (matchedV !== null) drawGuide('V', matchedV);
  if (matchedH !== null) drawGuide('H', matchedH);
  guideLayer.batchDraw();
}

function clearGuides() {
  guideLayer.destroyChildren();
  guideLayer.batchDraw();
}

function registerElement(node, type, keepDropdownOpen) {
  node.setAttr('elementType', type);
  node.draggable(true);
  node.on('dragmove', () => snapOnDragMove(node));
  node.on('dragend', () => { clearGuides(); recalcStageSize(); });
  node.on('transformend', () => {
    // Konva's Transformer resizes via scaleX/scaleY by default. Left as-is,
    // that stretches stroke width (borders/lines look thicker on one side
    // than the other) and blurs raster content. Bake the scale into the
    // node's real properties instead, every time, for every element type.
    const sx = node.scaleX(), sy = node.scaleY();
    if (type === 'text') {
      // Vertical resize (top/bottom handles, or a corner) changes font size.
      // Horizontal resize (left/right-middle handles) changes the box width
      // independently, so the box can be wider than its text — the text
      // stays centered within it (align:'center'), it doesn't get stretched.
      const newSize = Math.max(6, Math.round(node.fontSize() * sy));
      const newWidth = Math.max(newSize * 0.6, node.width() * sx);
      node.fontSize(newSize);
      node.width(newWidth);
      node.scaleX(1);
      node.scaleY(1);
      if (selected === node) renderPanel();
    } else if (type === 'line') {
      const pts = node.points();
      node.points(pts.map((v, i) => (i % 2 === 0 ? v * sx : v * sy)));
      node.scaleX(1);
      node.scaleY(1);
    } else {
      node.width(Math.max(4, node.width() * sx));
      node.height(Math.max(4, node.height() * sy));
      node.scaleX(1);
      node.scaleY(1);
    }
    clearGuides();
    recalcStageSize();
  });
  node.on('click tap', () => select(node));
  elements.push(node);
  layer.add(node);
  transformer.moveToTop();
  select(node, keepDropdownOpen);
  recalcStageSize();
}

// ---------- text elements ----------

// Text elements get an explicit, independently-resizable box width (not
// Konva's default auto-width-to-content) so the box can be wider than its
// text, with the text centered inside — like a real text box, not a label
// that hugs its own content. Called once right after creation: at that
// point Konva has already auto-measured a natural width, which we then pin
// as an explicit value going forward (resize changes it from here on, text
// content changes no longer do).
function pinTextWidth(node) {
  node.width(node.width());
}

function addText() {
  const node = new Konva.Text({
    x: MARGIN_LEFT, y: MARGIN_TOP,
    text: 'New text',
    fontSize: 50,
    fontFamily: 'DejaVu Sans',
    fontStyle: 'normal',
    fill: 'black',
    align: 'center',
  });
  pinTextWidth(node);
  node.on('dblclick dbltap', () => editText(node));
  registerElement(node, 'text');
}

function editText(node) {
  transformer.nodes([]);
  node.hide();
  layer.draw();

  const area = document.createElement('textarea');
  area.rows = 1;
  document.body.appendChild(area);
  area.value = node.text();
  Object.assign(area.style, {
    position: 'absolute',
    boxSizing: 'border-box',
    lineHeight: (node.lineHeight ? node.lineHeight() : 1),
    border: '1px solid #888', padding: '0', margin: '0', background: 'white', outline: 'none', resize: 'none', overflow: 'hidden',
  });

  // Recomputed on every call rather than once, and anchored to document flow
  // (position:absolute + scrollX/Y) rather than position:fixed, because
  // opening the on-screen keyboard on Android resizes/scrolls the viewport
  // and fixed-position elements drift away from the canvas underneath them.
  // Height is sized to the textarea's own rendered content (auto-grow),
  // not node.height(): Konva wraps text using canvas font-metrics, the
  // textarea wraps using the browser's own — they can disagree on line
  // count, and trusting Konva's number left the box taller than the text
  // actually visible inside it.
  function autoHeight() {
    area.style.height = 'auto';
    area.style.height = area.scrollHeight + 'px';
  }
  function reposition() {
    const rect = stage.container().getBoundingClientRect();
    const scale = stage.scaleX() || (parseFloat(document.getElementById('stage-container').style.transform.replace(/[^0-9.]/g, '')) || 1);
    Object.assign(area.style, {
      top: (rect.top + window.scrollY + node.y() * scale) + 'px',
      left: (rect.left + window.scrollX + node.x() * scale) + 'px',
      // +8px buffer: Konva measures text width via canvas, the textarea via
      // its own DOM layout — they can disagree by a couple pixels, and
      // without slack that was enough to wrap the last word onto a phantom
      // second line.
      width: (Math.max(120, node.width() * scale) + 8) + 'px',
      fontSize: (node.fontSize() * scale) + 'px',
      fontFamily: node.fontFamily(),
      fontWeight: node.fontStyle().includes('bold') ? 'bold' : 'normal',
      fontStyle: node.fontStyle().includes('italic') ? 'italic' : 'normal',
    });
    autoHeight();
  }
  reposition();
  area.addEventListener('input', autoHeight);
  area.focus();

  const vv = window.visualViewport;
  vv && vv.addEventListener('resize', reposition);
  vv && vv.addEventListener('scroll', reposition);
  window.addEventListener('scroll', reposition);
  window.addEventListener('resize', reposition);

  function finish() {
    node.text(area.value);
    vv && vv.removeEventListener('resize', reposition);
    vv && vv.removeEventListener('scroll', reposition);
    window.removeEventListener('scroll', reposition);
    window.removeEventListener('resize', reposition);
    document.body.removeChild(area);
    node.show();
    select(node);
    recalcStageSize();
  }
  area.addEventListener('blur', finish);
  area.addEventListener('keydown', (e) => { if (e.key === 'Escape') finish(); });
}

// ---------- image elements ----------

function addImageFromFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const imgObj = new Image();
    imgObj.onload = () => {
      const scale = Math.min(1, (LABEL_WIDTH - MARGIN_LEFT - MARGIN_RIGHT) / imgObj.width);
      const node = new Konva.Image({
        x: MARGIN_LEFT, y: MARGIN_TOP,
        image: imgObj,
        width: imgObj.width * scale,
        height: imgObj.height * scale,
      });
      // Keep the pristine original around so mode/threshold changes always
      // re-derive from source pixels rather than compounding on each other.
      node.setAttr('originalSrc', reader.result);
      node.setAttr('imageMode', 'grayscale');
      node.setAttr('threshold', 128);
      registerElement(node, 'image');
    };
    imgObj.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function applyImageMode(node) {
  const mode = node.getAttr('imageMode') || 'grayscale';
  const threshold = node.getAttr('threshold') || 128;
  const src = new Image();
  src.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = src.width;
    canvas.height = src.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(src, 0, 0);

    if (mode === 'bw') {
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        // Standard luminance-weighted grayscale, then a hard threshold —
        // this is what will actually print (no further dithering needed
        // on an already-binary image), so this preview is accurate.
        const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        const v = lum >= threshold ? 255 : 0;
        d[i] = d[i + 1] = d[i + 2] = v;
      }
      ctx.putImageData(imgData, 0, 0);
    }
    // 'grayscale' mode: pass the original through unmodified — brother_ql
    // dithers this at print time, same as the current default behaviour.

    node.image(canvas);
    layer.draw();
  };
  src.src = node.getAttr('originalSrc');
}

// ---------- date elements ----------

const DATE_FORMATS = {
  'dmy_slash': (d) => d.toLocaleDateString('en-GB'),                                    // 10/08/2026
  'dmy_short': (d) => d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }), // 10 Aug 2026
  'mdy_long':  (d) => d.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }), // Aug 10, 2026
  'iso':       (d) => d.toISOString().slice(0, 10),                                     // 2026-08-10
};
const DATE_FORMAT_LABELS = {
  dmy_slash: 'DD/MM/YYYY', dmy_short: 'DD Mon YYYY', mdy_long: 'Mon DD, YYYY', iso: 'YYYY-MM-DD',
};

function formatDate(dateStr, formatKey) {
  const d = new Date(dateStr + 'T00:00:00');
  return (DATE_FORMATS[formatKey] || DATE_FORMATS.dmy_slash)(d);
}

function toLocalISODate(d) {
  // Deliberately NOT toISOString() — that formats in UTC, which silently
  // shifts the calendar date by a day for anyone east of UTC (e.g. AWST,
  // UTC+8) once local midnight crosses back over the UTC date boundary.
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function addDateField() {
  const today = toLocalISODate(new Date());
  const node = new Konva.Text({
    x: MARGIN_LEFT, y: MARGIN_TOP,
    text: formatDate(today, 'dmy_slash'),
    fontSize: 50,
    fontFamily: 'DejaVu Sans',
    fontStyle: 'normal',
    fill: 'black',
    align: 'center',
  });
  pinTextWidth(node);
  node.on('dblclick dbltap', () => editText(node)); // still plain-text editable if wanted
  node.setAttr('isDateField', true);
  node.setAttr('dateValue', today);
  node.setAttr('dateFormat', 'dmy_slash');
  registerElement(node, 'text');
}

function updateDateField(node) {
  node.text(formatDate(node.getAttr('dateValue'), node.getAttr('dateFormat')));
  recalcStageSize();
}

// ---------- icon elements ----------
// A small curated starter set (fast, guaranteed to look good), plus a live
// search against Google's Material Symbols library for anything else.

const STARTER_ICONS = ['★', '✓', '✗', '⚠', '❄', '☀', '☂', '✉'];

function insertIcon(glyph) {
  const node = new Konva.Text({
    x: MARGIN_LEFT, y: MARGIN_TOP,
    text: glyph,
    fontSize: 80,
    fontFamily: 'DejaVu Sans',
    fontStyle: 'normal',
    fill: 'black',
    align: 'center',
  });
  pinTextWidth(node);
  registerElement(node, 'text', true);
  // Deliberately NOT closing the picker (keepDropdownOpen) — inserting
  // several icons in a row shouldn't mean reopening it each time, and
  // shouldn't bump it out of the shared panel slot for the new element's
  // properties either. Closed via its own ✕ button.
}

function insertIconImage(svgUrl) {
  const img = new Image();
  img.onload = () => {
    const size = 80;
    const node = new Konva.Image({
      x: MARGIN_LEFT, y: MARGIN_TOP,
      image: img,
      width: size, height: size,
    });
    registerElement(node, 'image', true);
    // Left open, same reasoning as insertIcon() — closed via its own ✕.
  };
  img.src = svgUrl;
}

// ---------- font library ----------
// DejaVu Sans (the four weights already on the Pi) plus any Google Fonts
// installed so far. Installing downloads the files once and self-hosts them
// — after that it works the same as DejaVu Sans, no live network dependency.

let installedFonts = { 'DejaVu Sans': true }; // family name -> true once its FontFaces are registered

function registerGoogleFontFamily(family, files) {
  const weightStyle = {
    normal_normal: { weight: 'normal', style: 'normal' },
    bold_normal: { weight: 'bold', style: 'normal' },
    normal_italic: { weight: 'normal', style: 'italic' },
    bold_italic: { weight: 'bold', style: 'italic' },
  };
  const loads = Object.entries(files).map(([key, url]) => {
    const desc = weightStyle[key];
    return new FontFace(family, `url(${url})`, desc).load();
  });
  return Promise.all(loads).then((faces) => {
    faces.forEach(f => document.fonts.add(f));
    installedFonts[family] = true;
    if (selected && selected.getAttr('elementType') === 'text') renderPanel();
  });
}

// Live preview of search results, loaded straight from Google's CDN — not
// the same thing as Install. Preview is ephemeral (nothing saved to disk);
// Install is the one that downloads and self-hosts the font permanently.
const previewedFamilies = new Set(); // families already preview-loaded this session

function loadFontPreview(family) {
  if (previewedFamilies.has(family)) return Promise.resolve();
  previewedFamilies.add(family);
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(family)}&display=swap`;
  document.head.appendChild(link);
  return document.fonts.load(`16px "${family}"`);
}

let fontSearchTimer = null;
document.getElementById('fontSearch').addEventListener('input', (e) => {
  clearTimeout(fontSearchTimer);
  const q = e.target.value.trim();
  const results = document.getElementById('fontResults');
  if (q.length < 2) { results.innerHTML = ''; return; }
  fontSearchTimer = setTimeout(async () => {
    const res = await fetch('/api/fonts/search?q=' + encodeURIComponent(q));
    const fonts = await res.json();

    // Render immediately in the page's default font, each with a spinner,
    // rather than waiting for every preview to load first.
    results.innerHTML = fonts.map(f => `
      <div class="row" style="margin-top:6px; align-items:center;">
        <span class="font-spinner" id="spinner-${f.id}"></span>
        <span id="preview-${f.id}" style="flex:1;">${f.family}</span>
        <button type="button" data-id="${f.id}" data-family="${f.family}" style="width:auto; margin-top:0; padding:4px 10px;">${installedFonts[f.family] ? 'Installed' : 'Install'}</button>
      </div>`
    ).join('');

    fonts.forEach((f) => {
      loadFontPreview(f.family)
        .then(() => {
          const span = document.getElementById(`preview-${f.id}`);
          if (span) span.style.fontFamily = `"${f.family}"`;
        })
        .catch(() => { /* preview is best-effort; Install still works without it */ })
        .finally(() => {
          const spinner = document.getElementById(`spinner-${f.id}`);
          if (spinner) spinner.remove();
        });
    });

    [...results.querySelectorAll('button')].forEach(btn => btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = 'Installing...';
      const r = await fetch('/api/fonts/install', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: btn.dataset.id }),
      });
      const data = await r.json();
      if (data.family) {
        await registerGoogleFontFamily(data.family, data.files);
        if (selected && selected.getAttr('elementType') === 'text') {
          selected.fontFamily(data.family);
          renderPanel();
          recalcStageSize();
        }
      }
      btn.textContent = 'Installed';
    });
  }, 400);
});

// One shared panel slot above the canvas: the property panel and the three
// toolbar dropdowns (Font/Icon/Templates) all live in the same place, and
// exactly one of them is visible at a time — whichever is currently
// relevant — instead of a dropdown and the property panel both showing at
// once in two separate areas.
const TOP_PANEL_IDS = ['panel', 'fontPicker', 'iconPicker', 'templatesPanel'];

function showTopPanel(id) {
  TOP_PANEL_IDS.forEach(pid => { document.getElementById(pid).style.display = pid === id ? 'block' : 'none'; });
}

function toggleDropdown(id, onOpen) {
  const el = document.getElementById(id);
  const opening = el.style.display === 'none';
  if (opening) {
    showTopPanel(id);
    if (onOpen) onOpen();
  } else {
    showTopPanel('panel');
  }
}

document.querySelectorAll('.dropdown-close').forEach(btn => {
  btn.addEventListener('click', () => showTopPanel('panel'));
});

document.getElementById('addFontBtn').onclick = () => toggleDropdown('fontPicker');

// ---------- border/rectangle and line elements ----------

const BORDER_STYLES = [
  { value: 'solid', label: 'Solid' },
  { value: 'dashed', label: 'Dashed' },
  { value: 'dotted', label: 'Dotted' },
  { value: 'rounded', label: 'Rounded corners' },
];

function applyBorderStyle(node, style) {
  node.setAttr('borderStyle', style);
  node.cornerRadius(0);
  node.lineCap('butt');
  switch (style) {
    case 'dashed':
      node.dash([node.strokeWidth() * 5, node.strokeWidth() * 3]);
      break;
    case 'dotted':
      node.dash([0.5, node.strokeWidth() * 2.5]);
      node.lineCap('round');
      break;
    case 'rounded':
      node.dash([]);
      node.cornerRadius(14);
      break;
    default:
      node.dash([]);
  }
}

function addBorder() {
  // Defaults to framing the whole label as it currently stands, rather than
  // a small arbitrary box — resize/reposition afterward as needed.
  const node = new Konva.Rect({
    x: MARGIN_LEFT, y: MARGIN_TOP,
    width: Math.max(40, LABEL_WIDTH - MARGIN_LEFT - MARGIN_RIGHT),
    height: Math.max(40, stage.height() - MARGIN_TOP - MARGIN_BOTTOM),
    stroke: 'black', strokeWidth: 2, fill: null,
  });
  applyBorderStyle(node, 'solid');
  registerElement(node, 'border');
}

function addLine() {
  const node = new Konva.Line({
    x: MARGIN_LEFT, y: MARGIN_TOP + 30,
    points: [0, 0, Math.max(40, LABEL_WIDTH - MARGIN_LEFT - MARGIN_RIGHT), 0],
    stroke: 'black', strokeWidth: 2, hitStrokeWidth: 24,
  });
  applyBorderStyle(node, 'solid');
  registerElement(node, 'line');
}

// ---------- property panel ----------

function fontDropdownHtml(currentFamily) {
  const families = Object.keys(installedFonts).sort();
  const items = families.map(f => `<div class="font-dropdown-item${f === currentFamily ? ' selected' : ''}" data-family="${f}" style="font-family:'${f}';" tabindex="0">${f}</div>`).join('');
  return `
    <div class="font-dropdown" id="p_fontfamily_wrap">
      <button type="button" class="font-dropdown-btn" id="p_fontfamily_btn" style="font-family:'${currentFamily}';">${currentFamily}</button>
      <div class="font-dropdown-list" id="p_fontfamily_list">${items}</div>
    </div>`;
}

function wireFontDropdown(onSelect) {
  const btn = document.getElementById('p_fontfamily_btn');
  const list = document.getElementById('p_fontfamily_list');
  btn.addEventListener('click', (e) => { e.stopPropagation(); list.classList.toggle('open'); });
  list.querySelectorAll('.font-dropdown-item').forEach(item => {
    item.addEventListener('click', () => {
      const family = item.dataset.family;
      btn.textContent = family;
      btn.style.fontFamily = `'${family}'`;
      list.classList.remove('open');
      onSelect(family);
    });
  });
  document.addEventListener('click', () => list.classList.remove('open'), { once: true });
}

function renderPanel() {
  const panel = document.getElementById('panel');
  if (!selected) { panel.innerHTML = '<div class="empty">Nothing selected</div>'; return; }

  const type = selected.getAttr('elementType');
  const isDateField = type === 'text' && selected.getAttr('isDateField');
  let html = `<h2>${isDateField ? 'Date' : type[0].toUpperCase() + type.slice(1)}</h2>`;

  if (isDateField) {
    const fmtOptions = Object.keys(DATE_FORMAT_LABELS)
      .map(k => `<option value="${k}" ${selected.getAttr('dateFormat') === k ? 'selected' : ''}>${DATE_FORMAT_LABELS[k]}</option>`)
      .join('');
    html += `
      <div class="fields-row">
        <div class="field"><label>Date</label><input type="date" id="p_datevalue" value="${selected.getAttr('dateValue')}"></div>
        <div class="row">
          <button id="p_dateminus" type="button">−1 day</button>
          <button id="p_dateplus" type="button">+1 day</button>
        </div>
        <div class="field"><label>Format</label><select id="p_dateformat">${fmtOptions}</select></div>
      </div>`;
  }

  if (type === 'text') {
    const isBold = selected.fontStyle().includes('bold');
    const isItalic = selected.fontStyle().includes('italic');
    const size = Math.round(selected.fontSize());
    html += `
      <div class="fields-row">
        <div class="field grow"><label>Font family</label>${fontDropdownHtml(selected.fontFamily())}</div>
        <div class="field grow">
          <label>Font size — <span id="p_fontsize_val">${size}</span>px</label>
          <input type="range" id="p_fontsize" value="${size}" min="10" max="300">
        </div>
        <div class="checks">
          <label><input type="checkbox" id="p_bold" ${isBold ? 'checked' : ''}> Bold</label>
          <label><input type="checkbox" id="p_italic" ${isItalic ? 'checked' : ''}> Italic</label>
        </div>
      </div>`;
  }

  if (type === 'border' || type === 'line') {
    const width = selected.strokeWidth();
    const currentStyle = selected.getAttr('borderStyle') || 'solid';
    const styleChoices = type === 'border' ? BORDER_STYLES : BORDER_STYLES.filter(s => s.value !== 'rounded');
    const styleOptions = styleChoices.map(s => `<option value="${s.value}" ${s.value === currentStyle ? 'selected' : ''}>${s.label}</option>`).join('');
    html += `
      <div class="fields-row">
        <div class="field grow"><label>Line width — <span id="p_strokewidth_val">${width}</span>px</label><input type="range" id="p_strokewidth" value="${width}" min="1" max="20"></div>
        <div class="field grow"><label>Style</label><select id="p_borderstyle">${styleOptions}</select></div>
      </div>`;
  }

  if (type === 'image') {
    const mode = selected.getAttr('imageMode') || 'grayscale';
    html += `
      <div class="fields-row">
        <div class="field grow">
          <label>Mode</label>
          <select id="p_imgmode">
            <option value="grayscale" ${mode === 'grayscale' ? 'selected' : ''}>Grayscale (dithered)</option>
            <option value="bw" ${mode === 'bw' ? 'selected' : ''}>Black &amp; White (threshold)</option>
          </select>
        </div>
        <div class="field grow" id="p_threshold_label" style="display:${mode === 'bw' ? 'flex' : 'none'};">
          <label>Threshold</label>
          <input type="range" id="p_threshold" min="0" max="255" value="${selected.getAttr('threshold') || 128}">
        </div>
      </div>`;
  }

  html += `
    <div class="actions-row">
      <div class="row">
        <button type="button" id="p_toFront" title="Bring to front">⤒</button>
        <button type="button" id="p_forward" title="Bring forward">▲</button>
        <button type="button" id="p_backward" title="Send backward">▼</button>
        <button type="button" id="p_toBack" title="Send to back">⤓</button>
      </div>
      <button id="p_delete">Delete</button>
    </div>`;
  panel.innerHTML = html;

  document.getElementById('p_toFront').addEventListener('click', () => { selected.moveToTop(); transformer.moveToTop(); layer.draw(); });
  document.getElementById('p_forward').addEventListener('click', () => { selected.moveUp(); transformer.moveToTop(); layer.draw(); });
  document.getElementById('p_backward').addEventListener('click', () => { selected.moveDown(); transformer.moveToTop(); layer.draw(); });
  document.getElementById('p_toBack').addEventListener('click', () => { selected.moveToBottom(); transformer.moveToTop(); layer.draw(); });

  if (isDateField) {
    document.getElementById('p_datevalue').addEventListener('change', (e) => {
      selected.setAttr('dateValue', e.target.value);
      updateDateField(selected);
    });
    document.getElementById('p_dateformat').addEventListener('change', (e) => {
      selected.setAttr('dateFormat', e.target.value);
      updateDateField(selected);
    });
    const shiftDate = (days) => {
      const d = new Date(selected.getAttr('dateValue') + 'T00:00:00');
      d.setDate(d.getDate() + days);
      const iso = toLocalISODate(d);
      selected.setAttr('dateValue', iso);
      document.getElementById('p_datevalue').value = iso;
      updateDateField(selected);
    };
    document.getElementById('p_dateminus').addEventListener('click', () => shiftDate(-1));
    document.getElementById('p_dateplus').addEventListener('click', () => shiftDate(1));
  }

  if (type === 'text') {
    wireFontDropdown((family) => {
      selected.fontFamily(family);
      recalcStageSize();
    });
    document.getElementById('p_fontsize').addEventListener('input', (e) => {
      const size = parseInt(e.target.value, 10) || 50;
      selected.fontSize(size);
      document.getElementById('p_fontsize_val').textContent = size;
      recalcStageSize();
    });
    const applyStyle = () => {
      const bold = document.getElementById('p_bold').checked;
      const italic = document.getElementById('p_italic').checked;
      selected.fontStyle(`${italic ? 'italic ' : ''}${bold ? 'bold' : ''}`.trim() || 'normal');
      recalcStageSize();
    };
    document.getElementById('p_bold').addEventListener('change', applyStyle);
    document.getElementById('p_italic').addEventListener('change', applyStyle);
  }

  if (type === 'border' || type === 'line') {
    document.getElementById('p_strokewidth').addEventListener('input', (e) => {
      const width = parseInt(e.target.value, 10) || 1;
      selected.strokeWidth(width);
      document.getElementById('p_strokewidth_val').textContent = width;
      applyBorderStyle(selected, selected.getAttr('borderStyle') || 'solid'); // keep dash/dot spacing proportional to the new width
      layer.draw();
    });
    document.getElementById('p_borderstyle').addEventListener('change', (e) => {
      applyBorderStyle(selected, e.target.value);
      layer.draw();
    });
  }

  if (type === 'image') {
    document.getElementById('p_imgmode').addEventListener('change', (e) => {
      selected.setAttr('imageMode', e.target.value);
      document.getElementById('p_threshold_label').style.display = e.target.value === 'bw' ? 'flex' : 'none';
      applyImageMode(selected);
    });
    document.getElementById('p_threshold').addEventListener('input', (e) => {
      selected.setAttr('threshold', parseInt(e.target.value, 10));
      applyImageMode(selected);
    });
  }

  document.getElementById('p_delete').addEventListener('click', deleteSelected);
}

// Even column widths across the toolbar, sized to whichever button is
// widest, rather than each button hugging its own label.
function equalizeToolbarButtonWidths() {
  const buttons = document.querySelectorAll('.toolbar > button');
  buttons.forEach(b => { b.style.width = ''; });

// ---------- templates (save/load named designs) ----------

function clearCanvas() {
  select(null);
  elements.forEach(el => el.destroy());
  elements = [];
  recalcStageSize();
}

function serializeElement(node) {
  const type = node.getAttr('elementType');
  const base = { type, x: node.x(), y: node.y(), rotation: node.rotation() };

  if (type === 'text') {
    return Object.assign(base, {
      text: node.text(),
      width: node.width(),
      fontFamily: node.fontFamily(),
      fontSize: node.fontSize(),
      fontStyle: node.fontStyle(),
      isDateField: !!node.getAttr('isDateField'),
      dateFormat: node.getAttr('dateFormat') || null,
    });
  }
  if (type === 'border') {
    return Object.assign(base, { width: node.width(), height: node.height(), strokeWidth: node.strokeWidth(), borderStyle: node.getAttr('borderStyle') });
  }
  if (type === 'line') {
    return Object.assign(base, { points: node.points(), strokeWidth: node.strokeWidth(), borderStyle: node.getAttr('borderStyle') });
  }
  if (type === 'image') {
    return Object.assign(base, {
      width: node.width(), height: node.height(),
      imageMode: node.getAttr('imageMode'), threshold: node.getAttr('threshold'),
      originalSrc: node.getAttr('originalSrc'),
    });
  }
  return base;
}

function serializeCanvas() {
  return elements.map(serializeElement);
}

function deserializeElement(desc) {
  if (desc.type === 'text') {
    const node = new Konva.Text({
      x: desc.x, y: desc.y, rotation: desc.rotation,
      text: desc.text, fontFamily: desc.fontFamily, fontSize: desc.fontSize,
      fontStyle: desc.fontStyle, fill: 'black', align: 'center',
    });
    // desc.width is undefined for templates saved before this was tracked —
    // fall back to auto-measuring, same as a freshly-created text element.
    node.width(desc.width || node.width());
    node.on('dblclick dbltap', () => editText(node));
    if (desc.isDateField) {
      node.setAttr('isDateField', true);
      node.setAttr('dateFormat', desc.dateFormat);
      // Deliberately NOT restoring the saved date — a reused template should
      // default to today, which is the whole point of a "date" field.
      node.setAttr('dateValue', toLocalISODate(new Date()));
      node.text(formatDate(node.getAttr('dateValue'), desc.dateFormat));
    }
    registerElement(node, 'text');
    return;
  }

  if (desc.type === 'border') {
    const node = new Konva.Rect({
      x: desc.x, y: desc.y, rotation: desc.rotation,
      width: desc.width, height: desc.height,
      stroke: 'black', strokeWidth: desc.strokeWidth, fill: null,
    });
    applyBorderStyle(node, desc.borderStyle || 'solid');
    registerElement(node, 'border');
    return;
  }

  if (desc.type === 'line') {
    const node = new Konva.Line({
      x: desc.x, y: desc.y, rotation: desc.rotation,
      points: desc.points, stroke: 'black', strokeWidth: desc.strokeWidth, hitStrokeWidth: 24,
    });
    applyBorderStyle(node, desc.borderStyle || 'solid');
    registerElement(node, 'line');
    return;
  }

  if (desc.type === 'image') {
    const imgObj = new Image();
    imgObj.onload = () => {
      const node = new Konva.Image({
        x: desc.x, y: desc.y, rotation: desc.rotation,
        image: imgObj, width: desc.width, height: desc.height,
      });
      node.setAttr('originalSrc', desc.originalSrc);
      node.setAttr('imageMode', desc.imageMode);
      node.setAttr('threshold', desc.threshold);
      registerElement(node, 'image');
      if (desc.imageMode === 'bw') applyImageMode(node);
    };
    imgObj.src = desc.originalSrc;
  }
}

function loadTemplateData(data) {
  clearCanvas();
  data.forEach(deserializeElement);
  select(null);
}

async function refreshTemplateList() {
  const res = await fetch('/api/templates');
  const names = await res.json();
  const list = document.getElementById('templateList');
  if (names.length === 0) {
    list.innerHTML = '<div class="hint">No saved templates yet.</div>';
    return;
  }
  list.innerHTML = names.map(n => `
    <div class="row" style="margin-top:6px;">
      <span style="flex:1;">${n}</span>
      <button type="button" data-action="load" data-name="${n}" style="width:auto; margin-top:0; padding:4px 10px;">Load</button>
      <button type="button" data-action="delete" data-name="${n}" style="width:auto; margin-top:0; padding:4px 10px;">Delete</button>
    </div>`).join('');
  list.querySelectorAll('button').forEach(btn => {
    btn.onclick = async () => {
      const name = btn.dataset.name;
      if (btn.dataset.action === 'load') {
        const res = await fetch('/api/templates/' + encodeURIComponent(name));
        loadTemplateData(await res.json());
        showTopPanel('panel');
      } else {
        await fetch('/api/templates/' + encodeURIComponent(name), { method: 'DELETE' });
        refreshTemplateList();
      }
    };
  });
}

document.getElementById('templatesBtn').onclick = () => toggleDropdown('templatesPanel', refreshTemplateList);

document.getElementById('templateSaveBtn').onclick = async () => {
  const nameInput = document.getElementById('templateName');
  const name = nameInput.value.trim();
  if (!name) return;
  select(null); // don't save mid-edit transformer state
  const res = await fetch('/api/templates/' + encodeURIComponent(name), {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(serializeCanvas()),
  });
  const status = document.getElementById('status');
  if (res.ok) {
    nameInput.value = '';
    refreshTemplateList();
    status.textContent = `Saved "${name}".`;
    status.className = 'ok';
  } else {
    const data = await res.json();
    status.textContent = data.error || 'Save failed';
    status.className = 'error';
  }
};

// ---------- print ----------

document.getElementById('printBtn').onclick = async () => {
  select(null); // deselect first so the Transformer's handles aren't in the exported image
  clearGuides();
  const status = document.getElementById('status');
  status.textContent = 'Printing...';
  status.className = '';

  const dataUrl = stage.toDataURL({ mimeType: 'image/png', pixelRatio: 1 });
  const blob = await (await fetch(dataUrl)).blob();
  const form = new FormData();
  form.append('image', blob, 'label.png');

  const res = await fetch('/api/print', { method: 'POST', body: form });
  const data = await res.json();

  status.textContent = data.success ? 'Printed.' : data.message;
  status.className = data.success ? 'ok' : 'error';
};

// ---------- boot ----------

const fonts = [
  new FontFace('DejaVu Sans', 'url(/static/fonts/DejaVuSans.ttf)', { weight: 'normal', style: 'normal' }),
  new FontFace('DejaVu Sans', 'url(/static/fonts/DejaVuSans-Bold.ttf)', { weight: 'bold', style: 'normal' }),
  new FontFace('DejaVu Sans', 'url(/static/fonts/DejaVuSans-Oblique.ttf)', { weight: 'normal', style: 'italic' }),
  new FontFace('DejaVu Sans', 'url(/static/fonts/DejaVuSans-BoldOblique.ttf)', { weight: 'bold', style: 'italic' }),
];
Promise.all(fonts.map(f => f.load())).then(async (loaded) => {
  loaded.forEach(f => document.fonts.add(f));

  // Re-register any Google Fonts installed in a previous session — they're
  // already self-hosted on disk, so this needs no network round-trip beyond
  // fetching the small manifest.
  try {
    const res = await fetch('/api/fonts/installed');
    const manifest = await res.json();
    await Promise.all(Object.values(manifest).map(f => registerGoogleFontFamily(f.family, f.files)));
  } catch (e) {
    console.warn('Could not load installed font manifest', e);
  }

  addText(); // seed with one text element so the label isn't blank on load
  scaleToViewport();
});
</script>
