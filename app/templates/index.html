<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LabelSmith</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons_app/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons_app/favicon-192.png">
  <link rel="apple-touch-icon" href="/static/icons_app/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <style>
    @font-face { font-family: 'DejaVu Sans'; src: url('/static/fonts/DejaVuSans.ttf') format('truetype'); font-weight: normal; font-style: normal; }
    @font-face { font-family: 'DejaVu Sans'; src: url('/static/fonts/DejaVuSans-Bold.ttf') format('truetype'); font-weight: bold; font-style: normal; }
    @font-face { font-family: 'DejaVu Sans'; src: url('/static/fonts/DejaVuSans-Oblique.ttf') format('truetype'); font-weight: normal; font-style: italic; }
    @font-face { font-family: 'DejaVu Sans'; src: url('/static/fonts/DejaVuSans-BoldOblique.ttf') format('truetype'); font-weight: bold; font-style: italic; }

    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 32px auto; padding: 0 16px; color: #333; }
    h1 { font-size: clamp(2.4rem, 7vw, 4.5rem); color: #444; text-align: center; margin: 0 0 20px; line-height: 1.15; }
    .title-emoji { font-size: 1.35em; vertical-align: -0.08em; }
    .title-letter { display: inline-block; margin-right: 0.12em; }
    .title-sub { display: block; font-weight: normal; color: #888; font-size: 0.25em; margin-top: 8px; }
    .layout { display: flex; flex-direction: column; gap: 16px; position: relative; }
    /* Grid (not flex) so button width stays consistent across wrapped
       rows — columns are sized once for the whole toolbar and reused on
       every row, so a short last row leaves blank space on the right
       instead of stretching its lone button to fill the row by itself. */
    .toolbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 0; position: relative; z-index: 1; }
    /* The toolbar buttons double as tabs for the shared panel slot below:
       the one matching what the panel is showing is drawn "attached" to it
       (same background, no bottom border, overlapping the panel's top
       border by 1px), the rest look like inactive tabs sitting behind it.
       That makes a heading inside the panel unnecessary. */
    .toolbar button { padding: 14px 16px; font-size: 1.05rem; cursor: pointer; background: #e9e9ec; color: #555; border: 1px solid #ccc; border-bottom: none; border-radius: 8px 8px 0 0; }
    .toolbar button:hover { background: #f2f2f5; }
    .toolbar button.tab-active { background: #fafcff; color: #222; font-weight: 600; margin-bottom: -1px; padding-bottom: 15px; }
    /* Sized to hug its actual content (the canvas) — must NOT flex-grow past
       that, or the background visually extends past the true label edge
       while dragged elements still clip exactly at the real boundary. */
    #stage-wrap { border: 1px solid #ccc; background: #fafafa; padding: 12px; display: inline-block; max-width: 100%; overflow-x: auto; flex: 0 0 auto; align-self: center; }
    #stage-container { transform-origin: top left; }

    /* Property panel: shares the .dropdown-panel card chrome (border/
       radius/background/shadow) so it looks like the same single area as
       the Font/Icon/Templates pickers, just with its own content layout —
       controls arranged in a row and wrapping, sized for touch rather than
       a narrow desktop sidebar. */
    #panel { width: 100%; box-sizing: border-box; font-size: 0.95rem; transition: opacity 0.15s; }
    #panel.disabled { opacity: 0.45; pointer-events: none; }
    #panel .field { display: flex; flex-direction: column; gap: 4px; }
    #panel .field label { font-size: 0.8rem; color: #666; }
    #panel .fields-row { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-end; }
    #panel .field.grow { flex: 1 1 260px; min-width: 220px; }
    #panel input[type=number], #panel input[type=text] { box-sizing: border-box; padding: 8px; font-size: 1rem; }
    #panel input[type=range] { width: 100%; height: 32px; }
    #panel .checks { display: flex; gap: 16px; align-items: center; }
    #panel .checks label { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; color: #333; }
    #panel .checks input { width: 20px; height: 20px; }
    #panel .row { display: flex; gap: 8px; align-items: center; }
    #panel button { padding: 10px 16px; cursor: pointer; font-size: 0.95rem; }
    #panel .actions-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    #panel .empty { color: #999; font-style: italic; }

    /* Custom font-family picker — native <select> can't reliably render each
       option in its own font (especially on Android), so this is a styled
       dropdown built from scratch. */
    .font-dropdown { position: relative; flex: 1; min-width: 0; }
    .font-row { display: flex; gap: 8px; align-items: stretch; }
    #panel .font-row .font-random { padding: 6px 12px; font-size: 1.2rem; line-height: 1; }
    .font-dropdown-btn { width: 100%; box-sizing: border-box; text-align: left; padding: 10px; font-size: 1rem; background: white; border: 1px solid #bbb; border-radius: 4px; cursor: pointer; }
    .font-dropdown-list { position: absolute; z-index: 20; top: 100%; left: 0; right: 0; max-height: 260px; overflow-y: auto; background: white; border: 1px solid #bbb; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); display: none; }
    .font-dropdown-list.open { display: block; }
    .font-dropdown-item { padding: 12px; font-size: 1.15rem; cursor: pointer; border-bottom: 1px solid #eee; }
    .font-dropdown-item:hover, .font-dropdown-item:focus { background: #f0f6ff; }
    .font-dropdown-item.selected { background: #e6f0ff; }

    /* Anchored to the bottom corners of .layout (i.e. the canvas box, its
       only in-flow content) rather than sitting in normal flow below it —
       the canvas is narrower and centered, so this uses the margin space
       beside it instead of adding a gap underneath. Print bottom-right,
       Templates mirrored bottom-left. */
    .actions { position: absolute; right: 0; bottom: 0; margin: 0; }
    .actions-left { right: auto; left: 0; }
    .actions button { padding: 10px 20px; font-size: 1rem; cursor: pointer; }
    /* Print gets extra weight — same footprint as a toolbar button (it's
       the one action that actually matters), a bold border year-round, and
       a pulsing purple glow on hover to invite the tap. */
    #printBtn { padding: 14px 16px; font-size: 1.05rem; border: 3px solid #333; border-radius: 4px; }
    #printBtn:hover { border-color: #7c3aed; animation: print-pulse 1.1s ease-in-out infinite; }
    /* Printer switched off/unplugged (see checkPrinter): greyed out and no
       inviting pulse, but still clickable — pressing it gives the error. */
    #printBtn.offline { border-color: #bbb; color: #999; }
    #printBtn.offline:hover { border-color: #bbb; animation: none; }
    @keyframes print-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.55); }
      50% { box-shadow: 0 0 0 9px rgba(124, 58, 237, 0); }
    }
    #status { margin-top: 12px; font-size: 0.9rem; min-height: 1.2em; text-align: right; }
    .error { color: #b00; }
    .ok { color: #060; }
    .hint { font-size: 0.8rem; color: #888; }

    /* Shared style for the Font/Icon/Templates toolbar dropdowns, so they
       look and behave consistently instead of each being a slightly
       different one-off box. */
    .dropdown-panel { position: relative; margin-bottom: 12px; padding: 14px; border: 1px solid #ccc; border-radius: 6px; background: #fafcff; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
    .dropdown-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .dropdown-panel-header h3 { margin: 0; font-size: 1rem; color: #444; }
    /* Font/Icon pickers are labelled by their active tab, so their close
       button just floats in the top-right corner instead of a header row. */
    .dropdown-panel > .dropdown-close { position: absolute; top: 10px; right: 10px; }
    .dropdown-close { width: auto; margin-top: 0; padding: 4px 12px; font-size: 1rem; line-height: 1.2; cursor: pointer; background: #eee; border: 1px solid #ccc; border-radius: 4px; }
    #iconPicker button { font-size: 1.6rem; padding: 6px 10px; margin: 2px; cursor: pointer; font-family: 'DejaVu Sans', sans-serif; }

    /* Category chips for browsing the Font/Icon libraries — an alternative
       to typing a name you might not know. */
    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    #iconPicker .chip, .chip { width: auto; margin: 0; padding: 6px 12px; font-size: 0.85rem; font-family: system-ui, sans-serif; border: 1px solid #bbb; border-radius: 999px; background: white; cursor: pointer; }
    .chip.active, #iconPicker .chip.active { background: #2563eb; color: white; border-color: #2563eb; }
    /* Icon-set switcher (Clip art / Emoji / …): same pill look as the
       category chips but larger, since it's the top-level choice. */
    #iconPicker .chip.icon-set { padding: 8px 16px; font-size: 0.95rem; font-weight: 600; }
    #iconResults img { display: block; }

    /* Font results as a tag cloud: each font is its own pill with a
       checkbox that installs it in place, rather than a vertical list of
       name + separate Install button. */
    .font-chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; font-size: 1rem; border: 1px solid #bbb; border-radius: 999px; background: white; cursor: pointer; }
    .font-chip:has(input:checked) { background: #eef4ff; border-color: #9db8e8; }
    .font-chip input[type=checkbox] { width: 17px; height: 17px; margin: 0; cursor: pointer; flex: 0 0 auto; }
    .font-chip .font-spinner { margin: 0; flex: 0 0 auto; }
    .font-spinner {
      display: inline-block; width: 12px; height: 12px; margin-right: 6px;
      border: 2px solid #ccc; border-top-color: #666; border-radius: 50%;
      animation: font-spin 0.7s linear infinite; vertical-align: middle;
    }
    @keyframes font-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1><span class="title-emoji">🏷️</span><span id="titleWord">LabelSmith</span><span class="title-sub">— 62mm label designer</span></h1>

  <div class="toolbar">
    <button id="addText">📝 Text</button>
    <button id="addImageBtn">🖼️ Image</button>
    <input type="file" id="imageInput" accept="image/*" style="display:none">
    <button id="addBorder">⬜ Border</button>
    <button id="addLine">➖ Line</button>
    <button id="addDate">📅 Date</button>
    <button id="addIconBtn">⭐ Icon</button>
    <button id="addFontBtn">🔤 Font</button>
  </div>
  <!-- Single shared panel slot: exactly one of these is visible at a time,
       whichever is currently relevant — a selected element's properties, or
       a toolbar dropdown (Font/Icon/Templates search). See showTopPanel(). -->
  <div id="panel" class="dropdown-panel disabled"><div class="empty">Nothing selected</div></div>
  <div id="templatesPanel" class="dropdown-panel" style="display:none;">
    <div class="dropdown-panel-header"><h3>Templates</h3><button type="button" class="dropdown-close" data-target="templatesPanel">✕</button></div>
    <div class="row" style="margin-top:0;">
      <input type="text" id="templateName" placeholder="Template name (e.g. Coffee)" style="flex:1;">
      <button type="button" id="templateSaveBtn" style="width:auto; margin-top:0; padding:6px 14px;">Save</button>
    </div>
    <div id="templateList" style="margin-top:10px;"></div>
  </div>
  <div id="iconPicker" class="dropdown-panel" style="display:none;">
    <button type="button" class="dropdown-close" data-target="iconPicker">✕</button>
    <div id="iconStarter" style="margin-right:48px;"></div>
    <div id="iconSets" class="chip-row" style="margin-top:10px;"></div>
    <div id="iconCategories"></div>
    <input type="text" id="iconSearch" placeholder="Or search by name..." style="width:100%; box-sizing:border-box;">
    <div id="iconResults" style="margin-top:6px;"></div>
    <div id="iconCredit" class="hint" style="margin-top:8px;"></div>
  </div>
  <div id="fontPicker" class="dropdown-panel" style="display:none;">
    <button type="button" class="dropdown-close" data-target="fontPicker">✕</button>
    <div id="fontCategories" style="margin-right:48px;"></div>
    <input type="text" id="fontSearch" placeholder="Or search Google Fonts by name..." style="width:100%; box-sizing:border-box;">
    <div id="fontResults" style="margin-top:6px; font-size:0.85rem;"></div>
  </div>

  <div class="layout">
    <div id="stage-wrap"><div id="stage-container"></div></div>
    <div class="actions actions-left">
      <button id="templatesBtn">📁 Templates</button>
      <button id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>↶</button>
      <button id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled>↷</button>
    </div>
    <div class="actions">
      <button id="printBtn">🖨️ Print</button>
    </div>
  </div>
  <div id="status"></div>

<script src="/static/vendor/konva.min.js"></script>
{% raw %}
<script>
const LABEL_WIDTH = 696;
// 696px IS the printer's full printable width for 62mm tape (brother_ql's
// "62" label spec: dots_printable=696) — the driver never touches pixels
// outside our image in that direction, so there's no hardware reason for a
// side margin. And in the feed direction (top/bottom), brother_ql already
// auto-inserts a 35-dot blank feed before every label for the cutter
// (label_specs['feed_margin'], added at print time, outside our image) —
// so MARGIN_TOP/BOTTOM aren't providing cutting clearance either. What's
// left here is just enough to keep ink off the tape's physical edge and
// text from looking flush-cut.
const MARGIN_TOP = 4, MARGIN_BOTTOM = 4, MARGIN_LEFT = 6, MARGIN_RIGHT = 6;
// Only a floor for the empty canvas (no elements yet) so it doesn't collapse
// to a sliver — real content almost always exceeds this on its own, so it
// should never be padding out a label that's shorter than it.
const MIN_HEIGHT = 40;

const stage = new Konva.Stage({ container: 'stage-container', width: LABEL_WIDTH, height: MIN_HEIGHT });
const layer = new Konva.Layer();
stage.add(layer);

const transformer = new Konva.Transformer({ rotateEnabled: true });
layer.add(transformer);

// Resize-snapping: boundBoxFunc receives the box the Transformer is about
// to apply and can hand back a corrected one — the standard Konva mechanism
// for this, rather than fighting the Transformer's own internal scale math.
// Skipped while rotated to keep the edge math simple (rotation makes "left
// edge" ambiguous in stage coordinates).
transformer.boundBoxFunc((oldBox, newBox) => {
  const node = transformer.nodes()[0];
  guideLayer.destroyChildren();
  if (!node || newBox.rotation !== 0) { guideLayer.batchDraw(); return newBox; }

  const stops = getGuideStops(node);
  const left = newBox.x, right = newBox.x + newBox.width;
  const top = newBox.y, bottom = newBox.y + newBox.height;

  for (const s of stops.vertical) {
    if (Math.abs(left - s) < SNAP_THRESHOLD) { newBox.width += newBox.x - s; newBox.x = s; drawGuide('V', s); break; }
    if (Math.abs(right - s) < SNAP_THRESHOLD) { newBox.width = s - newBox.x; drawGuide('V', s); break; }
  }
  for (const s of stops.horizontal) {
    if (Math.abs(top - s) < SNAP_THRESHOLD) { newBox.height += newBox.y - s; newBox.y = s; drawGuide('H', s); break; }
    if (Math.abs(bottom - s) < SNAP_THRESHOLD) { newBox.height = s - newBox.y; drawGuide('H', s); break; }
  }
  guideLayer.batchDraw();

  if (newBox.width < 5 || newBox.height < 5) return oldBox;
  return newBox;
});

// Separate, non-interactive layer for the temporary snap-guide lines drawn
// while dragging. Cleared before every export just in case — a stray guide
// line has no business ending up on a printed label.
const guideLayer = new Konva.Layer({ listening: false });
stage.add(guideLayer);

let elements = [];   // all Konva nodes the user placed
let selected = null; // currently selected node

// Undo/redo state — see the "undo / redo" section.
const HISTORY_LIMIT = 100;
let historyStack = [];
let historyIndex = -1;
let historyJson = null;   // JSON of historyStack[historyIndex], for the "did anything change" check
let historyTimer = null;
let restoringHistory = false;
// Which toolbar tab the property panel belongs to, set by renderPanel().
// Kept after deselecting, since the dimmed panel still shows those controls.
let panelTab = null;
const DROPDOWN_TABS = { fontPicker: 'addFontBtn', iconPicker: 'addIconBtn' };

// ---------- selection ----------

function select(node, keepDropdownOpen) {
  selected = node;
  transformer.nodes(node ? [node] : []);
  layer.draw();
  const panel = document.getElementById('panel');
  if (node) {
    if (!keepDropdownOpen) showTopPanel('panel');
    panel.classList.remove('disabled');
    renderPanel();
  } else {
    // Leave whatever was last shown in place, just dimmed — switching to a
    // blank "Nothing selected" panel and back is jarring while dragging
    // elements near each other, since selection blips through null.
    panel.classList.add('disabled');
  }
}

stage.on('click tap', (e) => {
  if (e.target === stage) { select(null); return; }
  if (elements.includes(e.target)) select(e.target);
});

document.addEventListener('keydown', (e) => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && selected && document.activeElement.tagName !== 'TEXTAREA' && document.activeElement.tagName !== 'INPUT') {
    deleteSelected();
  }
});

function deleteSelected() {
  if (!selected) return;
  elements = elements.filter(el => el !== selected);
  selected.destroy();
  select(null);
  recalcStageSize();
  scheduleHistoryCommit();
}

// ---------- stage sizing ----------

function recalcStageSize() {
  let maxBottom = MIN_HEIGHT - MARGIN_BOTTOM;
  for (const el of elements) {
    const box = el.getClientRect({ relativeTo: stage });
    maxBottom = Math.max(maxBottom, box.y + box.height);
  }
  stage.height(Math.max(maxBottom + MARGIN_BOTTOM, MIN_HEIGHT));
  scaleToViewport();
  layer.draw();
}

function scaleToViewport() {
  const wrap = document.getElementById('stage-wrap');
  const available = wrap.clientWidth - 24;
  const scale = Math.min(1, available / LABEL_WIDTH);
  document.getElementById('stage-container').style.transform = `scale(${scale})`;
  wrap.style.height = (stage.height() * scale + 24) + 'px';
}
window.addEventListener('resize', scaleToViewport);

// ---------- element registration (common wiring for every element type) ----------

// ---------- snap / alignment guides ----------

const SNAP_THRESHOLD = 14; // px, in stage coordinates — generous enough to actually notice/trust on touch

function getGuideStops(skipNode) {
  // Snap to the printable margins, not the raw stage edges — content that
  // snaps flush to x=0/LABEL_WIDTH would sit right at the roll's physical
  // edge, which is exactly what margins exist to avoid.
  const vertical = [MARGIN_LEFT, LABEL_WIDTH / 2, LABEL_WIDTH - MARGIN_RIGHT];
  const horizontal = [0];
  elements.forEach((el) => {
    if (el === skipNode) return;
    const box = el.getClientRect({ relativeTo: stage });
    vertical.push(box.x, box.x + box.width / 2, box.x + box.width);
    horizontal.push(box.y, box.y + box.height / 2, box.y + box.height);
  });
  return { vertical, horizontal };
}

function getNodeEdges(node, box) {
  return {
    vertical: [box.x, box.x + box.width / 2, box.x + box.width],
    horizontal: [box.y, box.y + box.height / 2, box.y + box.height],
  };
}

function drawGuide(orientation, pos) {
  const points = orientation === 'V' ? [pos, -6000, pos, 6000] : [-6000, pos, 6000, pos];
  guideLayer.add(new Konva.Line({ points, stroke: '#ff3b8d', strokeWidth: 2.5, dash: [8, 5] }));
}

function snapOnDragMove(node) {
  guideLayer.destroyChildren();
  const stops = getGuideStops(node);
  const box = node.getClientRect({ relativeTo: stage });
  const edges = getNodeEdges(node, box);

  // Find the single best-matching stop per axis (smallest snap distance).
  let dx = 0, bestVDiff = SNAP_THRESHOLD, matchedV = null;
  edges.vertical.forEach((edge) => {
    stops.vertical.forEach((stop) => {
      const diff = Math.abs(edge - stop);
      if (diff < bestVDiff) { bestVDiff = diff; dx = stop - edge; matchedV = stop; }
    });
  });
  let dy = 0, bestHDiff = SNAP_THRESHOLD, matchedH = null;
  edges.horizontal.forEach((edge) => {
    stops.horizontal.forEach((stop) => {
      const diff = Math.abs(edge - stop);
      if (diff < bestHDiff) { bestHDiff = diff; dy = stop - edge; matchedH = stop; }
    });
  });

  node.x(node.x() + dx);
  node.y(node.y() + dy);
  if (matchedV !== null) drawGuide('V', matchedV);
  if (matchedH !== null) drawGuide('H', matchedH);
  guideLayer.batchDraw();
}

function clearGuides() {
  guideLayer.destroyChildren();
  guideLayer.batchDraw();
}

// Keep a dragged element's bounding box from crossing the label's left/right/
// top edges — those are hard physical bounds (tape width, start of feed).
// The bottom is deliberately left unclamped: dragging something further down
// is how you make the label longer, and recalcStageSize() grows to fit it.
// Centre the selected element within the printable area. Uses the on-screen
// bounding box, so rotated elements centre by what you actually see. The
// label's height grows to fit its content, so vertically "the label" means
// the height the OTHER elements need — otherwise moving the bottom-most
// element would shrink the label under it and it would no longer be centred.
function centreSelected(axis) {
  const node = selected;
  if (!node) return;
  const box = node.getClientRect({ relativeTo: stage });
  if (axis === 'x') {
    const target = MARGIN_LEFT + (LABEL_WIDTH - MARGIN_LEFT - MARGIN_RIGHT - box.width) / 2;
    node.x(node.x() + target - box.x);
  } else {
    let bottom = Math.max(MIN_HEIGHT - MARGIN_BOTTOM, MARGIN_TOP + box.height);
    for (const el of elements) {
      if (el === node) continue;
      const b = el.getClientRect({ relativeTo: stage });
      bottom = Math.max(bottom, b.y + b.height);
    }
    const target = MARGIN_TOP + (bottom - MARGIN_TOP - box.height) / 2;
    node.y(node.y() + target - box.y);
  }
  recalcStageSize();
}

function clampToPanel(node) {
  const box = node.getClientRect({ relativeTo: stage });
  const clampedX = Math.max(Math.min(box.x, LABEL_WIDTH - box.width), 0);
  const clampedY = Math.max(box.y, 0);
  const dx = clampedX - box.x, dy = clampedY - box.y;
  if (dx || dy) {
    node.x(node.x() + dx);
    node.y(node.y() + dy);
  }
}

function registerElement(node, type, keepDropdownOpen) {
  node.setAttr('elementType', type);
  node.draggable(true);
  node.on('dragmove', () => { snapOnDragMove(node); clampToPanel(node); });
  node.on('dragend', () => { clearGuides(); recalcStageSize(); scheduleHistoryCommit(); });
  if (type === 'text') {
    // Text boxes always hug their text (see refitText), so every handle
    // means "make the text bigger/smaller": left/right handles scale it by
    // the horizontal drag, top/bottom and corners by the vertical one.
    // Converted to a real font size on every move, not just at the end, so
    // the text never shows stretched/squashed mid-drag.
    node.on('transform', () => {
      const anchor = transformer.getActiveAnchor() || '';
      const s = Math.abs(anchor.startsWith('middle') ? node.scaleX() : node.scaleY());
      node.fontSize(Math.max(6, node.fontSize() * s));
      node.scaleX(1);
      node.scaleY(1);
    });
  }
  node.on('transformend', () => {
    // Konva's Transformer resizes via scaleX/scaleY by default. Left as-is,
    // that stretches stroke width (borders/lines look thicker on one side
    // than the other) and blurs raster content. Bake the scale into the
    // node's real properties instead, every time, for every element type.
    const sx = node.scaleX(), sy = node.scaleY();
    if (type === 'text') {
      // Already baked into fontSize by the 'transform' handler above.
      if (selected === node) renderPanel();
    } else if (type === 'line') {
      const pts = node.points();
      node.points(pts.map((v, i) => (i % 2 === 0 ? v * sx : v * sy)));
      node.scaleX(1);
      node.scaleY(1);
    } else {
      node.width(Math.max(4, node.width() * sx));
      node.height(Math.max(4, node.height() * sy));
      node.scaleX(1);
      node.scaleY(1);
    }
    clampToPanel(node);
    clearGuides();
    recalcStageSize();
    scheduleHistoryCommit();
  });
  node.on('click tap', () => select(node));
  elements.push(node);
  layer.add(node);
  transformer.moveToTop();
  // While undo/redo rebuilds the canvas, restoreHistory() picks the
  // selection itself afterwards — selecting each element as it's re-added
  // would flip the panel through all of them.
  if (restoringHistory) return;
  select(node, keepDropdownOpen);
  recalcStageSize();
  scheduleHistoryCommit();
}

// ---------- text elements ----------

// Text elements keep Konva's default auto width, so the box is always
// exactly as wide as its widest line — no dead space either side, and the
// box edges ARE the text edges for snapping to margins/other elements.
// Multiple lines only come from explicit newlines, centered on each other.
//
// The catch is that any change to the text or its font changes the box
// width, which by default grows/shrinks from the left edge. refitText()
// wraps such a change and keeps whichever edge the user lined up: a left
// or right edge sitting on a snap stop (margin, another element's edge)
// stays put; anything else stays centered where it was.
const EDGE_TOLERANCE = 2; // px — snapping makes lined-up edges exact, this just absorbs float noise

function refitText(node, change) {
  const oldWidth = node.width();
  const box = node.getClientRect({ relativeTo: stage });
  change();
  const dw = node.width() - oldWidth;
  if (dw) {
    let shift = -dw / 2;
    if (node.rotation() === 0) {
      const stops = getGuideStops(node).vertical;
      const onStop = (edge) => stops.some(s => Math.abs(edge - s) <= EDGE_TOLERANCE);
      if (onStop(box.x)) shift = 0;
      else if (onStop(box.x + box.width)) shift = -dw;
    }
    shiftAlongText(node, shift);
  }
  clampToPanel(node);
  recalcStageSize();
}

// Move a text node along its own (possibly rotated) baseline direction.
function shiftAlongText(node, dx) {
  const r = node.rotation() * Math.PI / 180;
  node.x(node.x() + dx * Math.cos(r));
  node.y(node.y() + dx * Math.sin(r));
}

// Largest font size that fits the text across the printable width, centered.
function fitTextToWidth(node) {
  const available = LABEL_WIDTH - MARGIN_LEFT - MARGIN_RIGHT;
  // Text width is close to, but not exactly, linear in font size (hinting,
  // kerning), so a second pass corrects the small overshoot/undershoot.
  for (let i = 0; i < 2; i++) node.fontSize(node.fontSize() * available / node.width());
  if (node.rotation() === 0) node.x(MARGIN_LEFT + (available - node.width()) / 2);
  clampToPanel(node);
  recalcStageSize();
}

// Konva sizes a text box tall enough to hold a descender (g/j/p/q/y) on
// every line, so it doesn't clip descending text — but that headroom goes
// unused (and wastes vertical space on the printed label) whenever the
// current text happens to have no descenders, e.g. plain words or a
// formatted date. Only tighten the box when it's actually safe to.
function applyTightLineHeight(node) {
  node.lineHeight(/[gjpqy]/.test(node.text()) ? 1 : 0.85);
}

function addText() {
  const node = new Konva.Text({
    x: MARGIN_LEFT, y: MARGIN_TOP,
    text: 'New text',
    fontSize: 50,
    fontFamily: randomInstalledFont(),
    fontStyle: 'normal',
    fill: 'black',
    align: 'center',
  });
  applyTightLineHeight(node);
  node.on('dblclick dbltap', () => editText(node));
  registerElement(node, 'text');
  return node;
}

function editText(node) {
  transformer.nodes([]);
  node.hide();
  layer.draw();

  const area = document.createElement('textarea');
  area.rows = 1;
  // No soft wrapping — like the text box itself, only explicit newlines make
  // new lines; the textarea widens to fit instead (see autoSize).
  area.wrap = 'off';
  document.body.appendChild(area);
  area.value = node.text();
  Object.assign(area.style, {
    position: 'absolute',
    boxSizing: 'border-box',
    lineHeight: (node.lineHeight ? node.lineHeight() : 1),
    border: '1px solid #888', padding: '0', margin: '0', background: 'white', outline: 'none', resize: 'none', overflow: 'hidden',
  });

  // Recomputed on every call rather than once, and anchored to document flow
  // (position:absolute + scrollX/Y) rather than position:fixed, because
  // opening the on-screen keyboard on Android resizes/scrolls the viewport
  // and fixed-position elements drift away from the canvas underneath them.
  // Height is sized to the textarea's own rendered content (auto-grow),
  // not node.height(): Konva wraps text using canvas font-metrics, the
  // textarea wraps using the browser's own — they can disagree on line
  // count, and trusting Konva's number left the box taller than the text
  // actually visible inside it. Width likewise grows with what's typed.
  let minWidth = 120;
  function autoSize() {
    area.style.width = '0';
    // +8px buffer: Konva measures text width via canvas, the textarea via
    // its own DOM layout — they can disagree by a couple pixels.
    area.style.width = (Math.max(minWidth, area.scrollWidth) + 8) + 'px';
    area.style.height = 'auto';
    area.style.height = area.scrollHeight + 'px';
  }
  function reposition() {
    const rect = stage.container().getBoundingClientRect();
    const scale = stage.scaleX() || (parseFloat(document.getElementById('stage-container').style.transform.replace(/[^0-9.]/g, '')) || 1);
    minWidth = Math.max(120, node.width() * scale);
    Object.assign(area.style, {
      top: (rect.top + window.scrollY + node.y() * scale) + 'px',
      left: (rect.left + window.scrollX + node.x() * scale) + 'px',
      fontSize: (node.fontSize() * scale) + 'px',
      fontFamily: node.fontFamily(),
      fontWeight: node.fontStyle().includes('bold') ? 'bold' : 'normal',
      fontStyle: node.fontStyle().includes('italic') ? 'italic' : 'normal',
    });
    autoSize();
  }
  reposition();
  area.addEventListener('input', autoSize);
  area.focus();
  area.select(); // let the user start typing straight away instead of having to select the placeholder/existing text first

  const vv = window.visualViewport;
  vv && vv.addEventListener('resize', reposition);
  vv && vv.addEventListener('scroll', reposition);
  window.addEventListener('scroll', reposition);
  window.addEventListener('resize', reposition);

  function finish() {
    vv && vv.removeEventListener('resize', reposition);
    vv && vv.removeEventListener('scroll', reposition);
    window.removeEventListener('scroll', reposition);
    window.removeEventListener('resize', reposition);
    document.body.removeChild(area);
    node.show();
    refitText(node, () => {
      node.text(area.value);
      applyTightLineHeight(node);
    });
    scheduleHistoryCommit();
    select(node);
  }
  area.addEventListener('blur', finish);
  area.addEventListener('keydown', (e) => { if (e.key === 'Escape') finish(); });
}

// ---------- image elements ----------

function addImageFromFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const imgObj = new Image();
    imgObj.onload = () => {
      const scale = Math.min(1, (LABEL_WIDTH - MARGIN_LEFT - MARGIN_RIGHT) / imgObj.width);
      const node = new Konva.Image({
        x: MARGIN_LEFT, y: MARGIN_TOP,
        image: imgObj,
        width: imgObj.width * scale,
        height: imgObj.height * scale,
      });
      // Keep the pristine original around so mode/threshold changes always
      // re-derive from source pixels rather than compounding on each other.
      node.setAttr('originalSrc', reader.result);
      node.setAttr('imageMode', 'grayscale');
      node.setAttr('threshold', 128);
      registerElement(node, 'image');
    };
    imgObj.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function applyImageMode(node) {
  const mode = node.getAttr('imageMode') || 'grayscale';
  const threshold = node.getAttr('threshold') || 128;
  const src = new Image();
  src.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = src.width;
    canvas.height = src.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(src, 0, 0);

    if (mode === 'bw') {
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        // Standard luminance-weighted grayscale, then a hard threshold —
        // this is what will actually print (no further dithering needed
        // on an already-binary image), so this preview is accurate.
        const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        const v = lum >= threshold ? 255 : 0;
        d[i] = d[i + 1] = d[i + 2] = v;
      }
      ctx.putImageData(imgData, 0, 0);
    }
    // 'grayscale' mode: pass the original through unmodified — brother_ql
    // dithers this at print time, same as the current default behaviour.

    node.image(canvas);
    layer.draw();
  };
  src.src = node.getAttr('originalSrc');
}

// ---------- date elements ----------

const DATE_FORMATS = {
  'dmy_slash': (d) => d.toLocaleDateString('en-GB'),                                    // 10/08/2026
  'dmy_short': (d) => d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }), // 10 Aug 2026
  'mdy_long':  (d) => d.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }), // Aug 10, 2026
  'iso':       (d) => d.toISOString().slice(0, 10),                                     // 2026-08-10
};
const DATE_FORMAT_LABELS = {
  dmy_slash: 'DD/MM/YYYY', dmy_short: 'DD Mon YYYY', mdy_long: 'Mon DD, YYYY', iso: 'YYYY-MM-DD',
};

function formatDate(dateStr, formatKey) {
  const d = new Date(dateStr + 'T00:00:00');
  return (DATE_FORMATS[formatKey] || DATE_FORMATS.dmy_slash)(d);
}

function toLocalISODate(d) {
  // Deliberately NOT toISOString() — that formats in UTC, which silently
  // shifts the calendar date by a day for anyone east of UTC (e.g. AWST,
  // UTC+8) once local midnight crosses back over the UTC date boundary.
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function addDateField() {
  const today = toLocalISODate(new Date());
  const node = new Konva.Text({
    x: MARGIN_LEFT, y: MARGIN_TOP,
    text: formatDate(today, 'dmy_slash'),
    fontSize: 50,
    fontFamily: randomInstalledFont(),
    fontStyle: 'normal',
    fill: 'black',
    align: 'center',
  });
  applyTightLineHeight(node);
  // Right-align to the far edge of the label instead of dropping it at the
  // same top-left spot as everything else, where it lands on top of
  // whatever text is already there.
  node.x(LABEL_WIDTH - MARGIN_RIGHT - node.width());
  node.on('dblclick dbltap', () => editText(node)); // still plain-text editable if wanted
  node.setAttr('isDateField', true);
  node.setAttr('dateValue', today);
  node.setAttr('dateFormat', 'dmy_slash');
  registerElement(node, 'text');
}

function updateDateField(node) {
  refitText(node, () => {
    node.text(formatDate(node.getAttr('dateValue'), node.getAttr('dateFormat')));
    applyTightLineHeight(node);
  });
}

// ---------- icon elements ----------
// A small curated starter set (fast, guaranteed to look good), plus a live
// search against Google's Material Symbols library for anything else.

const STARTER_ICONS = ['★', '✓', '✗', '⚠', '❄', '☀', '☂', '✉'];

function insertIcon(glyph) {
  const node = new Konva.Text({
    x: MARGIN_LEFT, y: MARGIN_TOP,
    text: glyph,
    fontSize: 80,
    fontFamily: 'DejaVu Sans',
    fontStyle: 'normal',
    fill: 'black',
    align: 'center',
  });
  registerElement(node, 'text', true);
  // Deliberately NOT closing the picker (keepDropdownOpen) — inserting
  // several icons in a row shouldn't mean reopening it each time, and
  // shouldn't bump it out of the shared panel slot for the new element's
  // properties either. Closed via its own ✕ button.
}

// Icons are SVGs, but they're rasterised to a PNG once on insert and kept as
// the element's originalSrc — exactly like an uploaded photo — so the image
// mode/threshold options work on them and templates save them self-contained.
function insertIconImage(svgUrl) {
  const svg = new Image();
  svg.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = svg.naturalWidth;
    canvas.height = svg.naturalHeight;
    canvas.getContext('2d').drawImage(svg, 0, 0);
    const png = new Image();
    png.onload = () => {
      const height = 80;
      const node = new Konva.Image({
        x: MARGIN_LEFT, y: MARGIN_TOP,
        image: png,
        width: height * png.width / png.height, height,
      });
      node.setAttr('originalSrc', png.src);
      node.setAttr('imageMode', 'grayscale');
      node.setAttr('threshold', 128);
      registerElement(node, 'image', true);
      // Left open, same reasoning as insertIcon() — closed via its own ✕.
    };
    png.src = canvas.toDataURL('image/png');
  };
  svg.src = svgUrl;
}

// Several icon sets (see ICON_SETS in assets.py), switched with the chips

function renderIconResults(names) {

// ---------- font library ----------
// DejaVu Sans (the four weights already on the Pi) plus any Google Fonts
// installed so far. Installing downloads the files once and self-hosts them
// — after that it works the same as DejaVu Sans, no live network dependency.

let installedFonts = { 'DejaVu Sans': true }; // family name -> true once its FontFaces are registered

// New text/date elements start in a random installed font rather than always
// DejaVu Sans. Only installed families are candidates — they're already
// loaded, so the new element measures and prints correctly straight away.
// Skips the previous pick so two adds in a row never look identical.
let lastRandomFont = null;

function randomInstalledFont(exclude = lastRandomFont) {
  const families = Object.keys(installedFonts);
  const choices = families.length > 1 ? families.filter(f => f !== exclude) : families;
  lastRandomFont = choices[Math.floor(Math.random() * choices.length)];
  return lastRandomFont;
}

function registerGoogleFontFamily(family, files) {
  const weightStyle = {
    normal_normal: { weight: 'normal', style: 'normal' },
    bold_normal: { weight: 'bold', style: 'normal' },
    normal_italic: { weight: 'normal', style: 'italic' },
    bold_italic: { weight: 'bold', style: 'italic' },
  };
  const loads = Object.entries(files).map(([key, url]) => {
    const desc = weightStyle[key];
    return new FontFace(family, `url(${url})`, desc).load();
  });
  return Promise.all(loads).then((faces) => {
    faces.forEach(f => document.fonts.add(f));
    installedFonts[family] = true;
    if (selected && selected.getAttr('elementType') === 'text') renderPanel();
  });
}

// Live preview of search results, loaded straight from Google's CDN — not
// the same thing as Install. Preview is ephemeral (nothing saved to disk);
// Install is the one that downloads and self-hosts the font permanently.
const previewedFamilies = new Set(); // families already preview-loaded this session

function loadFontPreview(family) {
  if (previewedFamilies.has(family)) return Promise.resolve();
  previewedFamilies.add(family);
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(family)}&display=swap`;
  document.head.appendChild(link);
  return document.fonts.load(`16px "${family}"`);
}

function renderFontResults(fonts) {
  const results = document.getElementById('fontResults');

  // A tag cloud rather than a list: each font is a pill with a checkbox
  // that installs it in place, ticking on once done — no separate Install
  // button to hunt for per row.
  results.innerHTML = `<div class="chip-row">${fonts.map(f => `
    <label class="font-chip" data-id="${f.id}">
      <span class="font-chip-check" id="check-${f.id}">
        <input type="checkbox" data-id="${f.id}" data-family="${f.family}" ${installedFonts[f.family] ? 'checked disabled' : ''}>
      </span>
      <span id="preview-${f.id}">${f.family}</span>
    </label>`
  ).join('')}</div>`;

  fonts.forEach((f) => {
    loadFontPreview(f.family)
      .then(() => {
        const span = document.getElementById(`preview-${f.id}`);
        if (span) span.style.fontFamily = `"${f.family}"`;
      })
      .catch(() => { /* preview is best-effort; install still works without it */ });
  });

  results.querySelectorAll('input[type=checkbox]').forEach(cb => cb.addEventListener('change', async () => {
    if (!cb.checked) { cb.checked = true; return; } // installs are one-way, same as the old Install button
    const checkSlot = document.getElementById(`check-${cb.dataset.id}`);
    checkSlot.innerHTML = '<span class="font-spinner"></span>';
    const r = await fetch('/api/fonts/install', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: cb.dataset.id }),
    });
    const data = await r.json();
    if (data.family) {
      await registerGoogleFontFamily(data.family, data.files);
      if (selected && selected.getAttr('elementType') === 'text') {
        selected.fontFamily(data.family);
        renderPanel();
        recalcStageSize();
      }
    }
    checkSlot.innerHTML = `<input type="checkbox" data-id="${cb.dataset.id}" data-family="${cb.dataset.family}" checked disabled>`;
  }));
}

let fontSearchTimer = null;
document.getElementById('fontSearch').addEventListener('input', (e) => {
  clearTimeout(fontSearchTimer);
  const q = e.target.value.trim();
  if (q) document.querySelectorAll('#fontCategories .chip').forEach(c => c.classList.remove('active'));
  if (q.length < 2) { document.getElementById('fontResults').innerHTML = ''; return; }

// One shared panel slot above the canvas: the property panel and the three
// toolbar dropdowns (Font/Icon/Templates) all live in the same place, and
// exactly one of them is visible at a time — whichever is currently
// relevant — instead of a dropdown and the property panel both showing at
// once in two separate areas.
const TOP_PANEL_IDS = ['panel', 'fontPicker', 'iconPicker', 'templatesPanel'];

function showTopPanel(id) {
  TOP_PANEL_IDS.forEach(pid => { document.getElementById(pid).style.display = pid === id ? 'block' : 'none'; });
  updateActiveTab();
}


function updateActiveTab() {
  const shown = TOP_PANEL_IDS.find(pid => document.getElementById(pid).style.display !== 'none');
  const activeId = shown === 'panel' ? panelTab : DROPDOWN_TABS[shown];
  document.querySelectorAll('.toolbar button').forEach(b => b.classList.toggle('tab-active', b.id === activeId));
}

function toggleDropdown(id, onOpen) {
  const el = document.getElementById(id);
  const opening = el.style.display === 'none';
  if (opening) {

}

// ---------- border/rectangle and line elements ----------

const BORDER_STYLES = [
  { value: 'solid', label: 'Solid' },
  { value: 'dashed', label: 'Dashed' },
  { value: 'dotted', label: 'Dotted' },
  { value: 'rounded', label: 'Rounded corners' },
];

function applyBorderStyle(node, style) {
  node.setAttr('borderStyle', style);
  // Konva.Line has no cornerRadius — only Konva.Rect (used for 'border')
  // supports it, and the panel already hides the 'rounded' choice for lines.
  const hasCornerRadius = typeof node.cornerRadius === 'function';
  if (hasCornerRadius) node.cornerRadius(0);
  node.lineCap('butt');
  switch (style) {
    case 'dashed':
      node.dash([node.strokeWidth() * 5, node.strokeWidth() * 3]);
      break;
    case 'dotted':
      node.dash([0.5, node.strokeWidth() * 2.5]);
      node.lineCap('round');
      break;
    case 'rounded':
      node.dash([]);
      if (hasCornerRadius) node.cornerRadius(14);
      break;
    default:
      node.dash([]);
  }
}

function addBorder() {
  // Defaults to framing the whole label as it currently stands, rather than
  // a small arbitrary box — resize/reposition afterward as needed.
  const node = new Konva.Rect({
    x: MARGIN_LEFT, y: MARGIN_TOP,
    width: Math.max(40, LABEL_WIDTH - MARGIN_LEFT - MARGIN_RIGHT),
    height: Math.max(40, stage.height() - MARGIN_TOP - MARGIN_BOTTOM),
    stroke: 'black', strokeWidth: 2, fill: null,
  });
  applyBorderStyle(node, 'solid');
  registerElement(node, 'border');
}

function addLine() {
  const node = new Konva.Line({
    x: MARGIN_LEFT, y: MARGIN_TOP + 30,
    points: [0, 0, Math.max(40, LABEL_WIDTH - MARGIN_LEFT - MARGIN_RIGHT), 0],
    stroke: 'black', strokeWidth: 2, hitStrokeWidth: 24,
  });
  applyBorderStyle(node, 'solid');
  registerElement(node, 'line');
}

// ---------- templates (save/load named designs) ----------

function clearCanvas() {
  select(null);
  elements.forEach(el => el.destroy());
  elements = [];
  recalcStageSize();
}

function serializeElement(node) {
  const type = node.getAttr('elementType');
  const base = { type, x: node.x(), y: node.y(), rotation: node.rotation() };

  if (type === 'text') {
    return Object.assign(base, {
      text: node.text(),
      fontFamily: node.fontFamily(),
      fontSize: node.fontSize(),
      fontStyle: node.fontStyle(),
      isDateField: !!node.getAttr('isDateField'),
      dateFormat: node.getAttr('dateFormat') || null,
      dateValue: node.getAttr('dateValue') || null,
    });
  }
  if (type === 'border') {
    return Object.assign(base, { width: node.width(), height: node.height(), strokeWidth: node.strokeWidth(), borderStyle: node.getAttr('borderStyle') });
  }
  if (type === 'line') {
    return Object.assign(base, { points: node.points(), strokeWidth: node.strokeWidth(), borderStyle: node.getAttr('borderStyle') });
  }
  if (type === 'image') {
    return Object.assign(base, {
      width: node.width(), height: node.height(),
      imageMode: node.getAttr('imageMode'), threshold: node.getAttr('threshold'),
      originalSrc: node.getAttr('originalSrc'),
    });
  }
  return base;
}

// In stacking order (back to front), not the order elements were added —
// the ⤒▲▼⤓ buttons reorder the Konva layer without touching `elements`.
function serializeCanvas() {
  return [...elements].sort((a, b) => a.zIndex() - b.zIndex()).map(serializeElement);
}

// keepDate: undo/redo passes true to restore a date field exactly as it
// was; loading a template leaves it false so the date resets to today.
function deserializeElement(desc, keepDate) {
  if (desc.type === 'text') {
    const node = new Konva.Text({
      x: desc.x, y: desc.y, rotation: desc.rotation,
      text: desc.text, fontFamily: desc.fontFamily, fontSize: desc.fontSize,
      fontStyle: desc.fontStyle, fill: 'black', align: 'center',
    });
    // Templates saved while text boxes had a fixed width carry desc.width.
    // Convert to the auto-width box without moving anything on the label:
    // bake any word-wrapping that width caused into explicit newlines, and
    // keep the text centered where it was (it was align:'center' inside).
    if (desc.width) {
      node.width(desc.width);
      const lines = node.textArr.map(l => l.text);
      node.width('auto');
      node.text(lines.join('\n'));
      shiftAlongText(node, (desc.width - node.width()) / 2);
    }
    node.on('dblclick dbltap', () => editText(node));
    if (desc.isDateField) {
      node.setAttr('isDateField', true);
      node.setAttr('dateFormat', desc.dateFormat);
      // Deliberately NOT restoring the saved date — a reused template should
      // default to today, which is the whole point of a "date" field.
      node.setAttr('dateValue', keepDate && desc.dateValue ? desc.dateValue : toLocalISODate(new Date()));
      node.text(formatDate(node.getAttr('dateValue'), desc.dateFormat));
    }
    applyTightLineHeight(node);
    registerElement(node, 'text');
    return;
  }

  if (desc.type === 'border') {
    const node = new Konva.Rect({
      x: desc.x, y: desc.y, rotation: desc.rotation,
      width: desc.width, height: desc.height,
      stroke: 'black', strokeWidth: desc.strokeWidth, fill: null,
    });
    applyBorderStyle(node, desc.borderStyle || 'solid');
    registerElement(node, 'border');
    return;
  }

  if (desc.type === 'line') {
    const node = new Konva.Line({
      x: desc.x, y: desc.y, rotation: desc.rotation,
      points: desc.points, stroke: 'black', strokeWidth: desc.strokeWidth, hitStrokeWidth: 24,
    });
    applyBorderStyle(node, desc.borderStyle || 'solid');
    registerElement(node, 'line');
    return;
  }

  if (desc.type === 'image') {
    // Added straight away (drawn once the pixels arrive) rather than from
    // onload, so images keep their place in the stacking order instead of
    // landing on top of whatever finished loading first.
    const imgObj = new Image();
    const node = new Konva.Image({
      x: desc.x, y: desc.y, rotation: desc.rotation,
      image: imgObj, width: desc.width, height: desc.height,
    });
    node.setAttr('originalSrc', desc.originalSrc);
    node.setAttr('imageMode', desc.imageMode);
    node.setAttr('threshold', desc.threshold);
    imgObj.onload = () => {
      if (desc.imageMode === 'bw') applyImageMode(node);
      else layer.batchDraw();
    };
    imgObj.src = desc.originalSrc;
    registerElement(node, 'image');
  }
}

// ---------- undo / redo ----------
// Snapshots of the whole design (the same serialized form templates use),
// taken shortly after anything changes. Debounced so dragging a slider is
// one undo step, not dozens, and skipped when nothing actually changed
// (e.g. clicking a button that didn't alter the design).


function commitHistory() {
  clearTimeout(historyTimer);
  const snap = serializeCanvas();
  const json = JSON.stringify(snap);
  if (json === historyJson) return;
  historyStack = historyStack.slice(0, historyIndex + 1);
  historyStack.push(snap);
  if (historyStack.length > HISTORY_LIMIT) historyStack.shift();
  historyIndex = historyStack.length - 1;
  historyJson = json;
  updateHistoryButtons();
}

function scheduleHistoryCommit() {
  if (restoringHistory) return;
  clearTimeout(historyTimer);
  historyTimer = setTimeout(commitHistory, 400);
}

function restoreHistory(index) {
  // Selection is remembered by stacking position, since the nodes
  // themselves are all recreated.
  const order = [...elements].sort((a, b) => a.zIndex() - b.zIndex());
  const selectedPos = selected ? order.indexOf(selected) : -1;

  historyIndex = index;
  historyJson = JSON.stringify(historyStack[index]);
  restoringHistory = true;
  clearCanvas();
  historyStack[index].forEach(desc => deserializeElement(desc, true));
  restoringHistory = false;
  recalcStageSize();
  if (selectedPos >= 0 && selectedPos < elements.length) select(elements[selectedPos], true);
  updateHistoryButtons();
}

function undo() {
  commitHistory(); // flush a pending change first, so it's the one undone
  if (historyIndex > 0) restoreHistory(historyIndex - 1);
}

function redo() {
  if (historyIndex < historyStack.length - 1) restoreHistory(historyIndex + 1);
}

function updateHistoryButtons() {
  document.getElementById('undoBtn').disabled = historyIndex <= 0;
  document.getElementById('redoBtn').disabled = historyIndex >= historyStack.length - 1;
}

document.getElementById('undoBtn').onclick = undo;
document.getElementById('redoBtn').onclick = redo;

document.addEventListener('keydown', (e) => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const tag = document.activeElement.tagName;
  if (tag === 'TEXTAREA' || tag === 'INPUT') return; // leave text fields their own undo
  const key = e.key.toLowerCase();
  if (key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if ((key === 'z' && e.shiftKey) || key === 'y') { e.preventDefault(); redo(); }
});

// Every property-panel control (sliders, dropdowns, checkboxes, the font
// picker, arrange/centre buttons…) changes the selected element, so rather
// than wiring each one individually, any interaction with the panel queues
// a snapshot; commitHistory() ignores the ones that changed nothing.
['input', 'change', 'click'].forEach(type =>
  document.getElementById('panel').addEventListener(type, scheduleHistoryCommit));

function loadTemplateData(data) {
  clearCanvas();
  data.forEach(deserializeElement);
  select(null);
}

async function refreshTemplateList() {
  const res = await fetch('/api/templates');
  const names = await res.json();
  const list = document.getElementById('templateList');
  if (names.length === 0) {
    list.innerHTML = '<div class="hint">No saved templates yet.</div>';

  }
  list.innerHTML = names.map(n => `
    <div class="row" style="margin-top:6px;">
      <span style="flex:1;">${n}</span>
      <button type="button" data-action="load" data-name="${n}" style="width:auto; margin-top:0; padding:4px 10px;">Load</button>
      <button type="button" data-action="delete" data-name="${n}" style="width:auto; margin-top:0; padding:4px 10px;">Delete</button>
    </div>`).join('');
  list.querySelectorAll('button').forEach(btn => {
    btn.onclick = async () => {
      const name = btn.dataset.name;
      if (btn.dataset.action === 'load') {
        const res = await fetch('/api/templates/' + encodeURIComponent(name));
        loadTemplateData(await res.json());
        showTopPanel('panel');
      } else {
        await fetch('/api/templates/' + encodeURIComponent(name), { method: 'DELETE' });
        refreshTemplateList();
      }
    };
  });
}

document.getElementById('templatesBtn').onclick = () => toggleDropdown('templatesPanel', refreshTemplateList);

document.getElementById('templateSaveBtn').onclick = async () => {
  const nameInput = document.getElementById('templateName');
  const name = nameInput.value.trim();
  if (!name) return;
  select(null); // don't save mid-edit transformer state
  const res = await fetch('/api/templates/' + encodeURIComponent(name), {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(serializeCanvas()),
  });

    status.textContent = data.error || 'Save failed';

};

// Checked on load, every 15s, and whenever the tab comes back into view, so
// "printer is off" shows up before you press Print rather than after.
const PRINTER_OFFLINE_MSG = 'Printer offline — is it switched on?';

async function checkPrinter() {
  let online;
  try {
    online = (await (await fetch('/api/printer/status')).json()).online;
  } catch {
    return; // server unreachable — nothing useful to say about the printer
  }
  const btn = document.getElementById('printBtn');
  const status = document.getElementById('status');
  btn.classList.toggle('offline', !online);
  btn.title = online ? '' : PRINTER_OFFLINE_MSG;
  if (!online && !status.textContent) {
    status.textContent = PRINTER_OFFLINE_MSG;
    status.className = 'error';
  } else if (online && status.textContent === PRINTER_OFFLINE_MSG) {
    status.textContent = '';
    status.className = '';
  }
}
checkPrinter();
setInterval(() => { if (!document.hidden) checkPrinter(); }, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkPrinter(); });

document.getElementById('printBtn').onclick = async () => {

  clearGuides();
  const status = document.getElementById('status');

  status.className = '';

  const dataUrl = stage.toDataURL({ mimeType: 'image/png', pixelRatio: 1 });
  const blob = await (await fetch(dataUrl)).blob();
  const form = new FormData();
  form.append('image', blob, 'label.png');

  const res = await fetch('/api/print', { method: 'POST', body: form });

};

// ---------- decorative title ----------
// Purely cosmetic, nothing to do with the printable label: each letter of
// the title gets a random font pulled from the same Display/Handwriting
// categories used for browsing in the Font picker, previewed the same
// ephemeral way as a search result (not installed/saved).
async function randomizeTitleFonts() {
  const word = document.getElementById('titleWord');
  const letters = [...word.textContent].map((ch) => {
    const span = document.createElement('span');
    span.className = 'title-letter';
    span.textContent = ch;
    return span;
  });
  word.innerHTML = '';
  letters.forEach(s => word.appendChild(s));

  let pool;
  try {
    const [display, handwriting] = await Promise.all([
      fetch('/api/fonts/search?category=display').then(r => r.json()),
      fetch('/api/fonts/search?category=handwriting').then(r => r.json()),
    ]);
    // Google's "Playwrite" family is handwriting-practice fonts, not
    // decorative ones — the "Guides" variants literally bake dotted
    // stroke-order guide marks into the glyphs, which reads as broken
    // rendering rather than fancy.
    pool = [...display, ...handwriting].filter(f => !/playwrite/i.test(f.family));
  } catch (e) {
    return; // decorative only — leave the default font if this fails
  }
  if (!pool.length) return;

  letters.forEach((span) => {
    const font = pool[Math.floor(Math.random() * pool.length)];
    loadFontPreview(font.family)
      .then(() => { span.style.fontFamily = `"${font.family}"`; })
      .catch(() => { /* best-effort — letter just stays in the default font */ });
  });
}

// ---------- boot ----------

const fonts = [
  new FontFace('DejaVu Sans', 'url(/static/fonts/DejaVuSans.ttf)', { weight: 'normal', style: 'normal' }),
  new FontFace('DejaVu Sans', 'url(/static/fonts/DejaVuSans-Bold.ttf)', { weight: 'bold', style: 'normal' }),
  new FontFace('DejaVu Sans', 'url(/static/fonts/DejaVuSans-Oblique.ttf)', { weight: 'normal', style: 'italic' }),
  new FontFace('DejaVu Sans', 'url(/static/fonts/DejaVuSans-BoldOblique.ttf)', { weight: 'bold', style: 'italic' }),
];
Promise.all(fonts.map(f => f.load())).then(async (loaded) => {
  loaded.forEach(f => document.fonts.add(f));

  // Re-register any Google Fonts installed in a previous session — they're
  // already self-hosted on disk, so this needs no network round-trip beyond
  // fetching the small manifest.
  try {
    const res = await fetch('/api/fonts/installed');
    const manifest = await res.json();
    await Promise.all(Object.values(manifest).map(f => registerGoogleFontFamily(f.family, f.files)));
  } catch (e) {
    console.warn('Could not load installed font manifest', e);
  }

  // Seed with one text element, ready to type over immediately, so the
  // label isn't blank on load and there's no click-to-select step first.
  editText(addText());
  scaleToViewport();
  randomizeTitleFonts();
});
</script>
