<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Label Designer (Phase 0)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.1rem; color: #444; }
    textarea { width: 100%; height: 100px; font-size: 1rem; box-sizing: border-box; }
    label { display: block; margin-top: 12px; font-size: 0.9rem; color: #555; }
    input[type=number] { width: 80px; }
    button { margin-top: 16px; padding: 10px 20px; font-size: 1rem; cursor: pointer; }
    #preview { margin-top: 20px; border: 1px solid #ccc; padding: 8px; background: #fafafa; }
    #preview img { max-width: 100%; }
    #status { margin-top: 12px; font-size: 0.9rem; }
    .error { color: #b00; }
    .ok { color: #060; }
  </style>
</head>
<body>
  <h1>Label Designer — Phase 0 skeleton (62mm)</h1>
  <textarea id="text" placeholder="Label text&#10;(one font for now — rich editor lands in Phase 2)"></textarea>
  <label>Font size <input type="number" id="font_size" value="60" min="10" max="200"></label>
  <button id="previewBtn">Preview</button>
  <button id="printBtn">Print</button>
  <div id="status"></div>
  <div id="preview"></div>

<script>
async function request(path) {
  const body = new URLSearchParams({
    text: document.getElementById('text').value,
    font_size: document.getElementById('font_size').value,
  });
  const res = await fetch(path, { method: 'POST', body });
  return { res, data: await res.json() };
}

document.getElementById('previewBtn').onclick = async () => {
  const status = document.getElementById('status');
  status.textContent = 'Rendering preview...';
  status.className = '';
  const { res, data } = await request('/api/preview');
  if (data.success) {
    document.getElementById('preview').innerHTML = `<img src="${data.image}">`;
    status.textContent = '';
  } else {
    status.textContent = data.message;
    status.className = 'error';
  }
};

document.getElementById('printBtn').onclick = async () => {
  const status = document.getElementById('status');
  status.textContent = 'Printing...';
  status.className = '';
  const { res, data } = await request('/api/print');
  if (data.success) {
    status.textContent = 'Printed.';
    status.className = 'ok';
  } else {
    status.textContent = data.message;
    status.className = 'error';
  }
};
</script>
</body>
</html>
